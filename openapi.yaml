openapi: 3.1.0
info:
  title: pergent.sh
  version: 0.13.0
  summary: HTTP routes of the pergent.sh server.
  description: |
    pergent.sh runs pergent code reviews as Kubernetes Jobs. It serves one port,
    plus a second one with a single route (`GET /metrics`) when `metrics_listen`
    is set. This document describes every route it serves, except the embedded
    dashboard pages.

    **Not described:** the dashboard single-page app. `GET /` and every other
    path that no route below matches is the app (HTML) when `dashboard.url` is
    set, and 404 otherwise. It is not an API. Also not described: the catch-all
    `/api/` (404 JSON for an unknown API path, 401 without a session) and the
    404 placeholders for `/api/reviews/{instance}` and
    `/api/repositories/{instance}`, which only keep the router from
    redirecting.

    **Who calls what**

    | Group | Caller | Authentication |
    | --- | --- | --- |
    | `/webhooks/...` | GitLab, GitHub | `X-Gitlab-Token` header, `X-Hub-Signature-256` signature |
    | `/runs/{id}/result`, `/skill-fetches/{id}/result`, `/readiness-scans/{id}/result` | Jobs pergent.sh started | one-time bearer token per Job |
    | `/auth/...` | the dashboard in a browser | none, or the sign-in cookies |
    | `/api/...` | the dashboard in a browser | session cookie, plus `X-CSRF-Token` on writes |
    | `/healthz` | probes | none |
    | `/metrics` | Prometheus, on the `metrics_listen` port only | none: the port is not exposed through `public_url` |

    **Conditional routes.** `/auth/` and `/api/` exist only when `dashboard.url`
    is set. `/skill-fetches/{id}/result` and `/readiness-scans/{id}/result`
    exist only then too. Without them the path is 404.

    **Dashboard API.** Every `/api/` and `/auth/` response is sent
    `Cache-Control: no-store` and `X-Content-Type-Options: nosniff`. Errors are
    `{"error": "message"}`, with a `code` for a few (see `ErrorBody`). Times
    are RFC 3339. Field names are camelCase.

    *Roles.* An account is an **admin** or a **user**. An admin (a local
    admin who signs in with a password, or an SSO account an admin made one)
    sees and may do everything, with no team. A user sees only the repositories
    their teams cover, with the highest role their teams give on each: on a
    team a user is a `viewer` or a `maintainer`. Nothing asks GitLab or GitHub
    what a person may read. A user on no team is *waiting*: every `/api/` route
    but `GET /api/me` answers 403 with `code: waiting`. A local admin that must
    change its password gets 403 with `code: password_change_required` for
    everything but `GET /api/me`, `POST /auth/logout` and
    `POST /auth/password/change`. A repository, review or run the user cannot
    see is answered exactly like one that does not exist (404).

    *Two areas.* The dashboard has a user area (Repositories, Reviews, Skills;
    sign-in at `/sign-in`) and an admin area (Users, Teams, Integrations,
    Settings, Audit log; sign-in at `/admin/sign-in`). The server enforces the
    split on the data: a route marked `x-pergent-access: admin` answers anyone
    who is not an admin, an account waiting for a team included, `404` with the
    body of an unknown path, never `403`. The web app is one app served for any
    page path; it shows a user the "not found" page for an admin page, but the
    data behind it is what the server holds back. A route both areas use (such
    as reading the skill library) is a `session` route that checks in its
    handler.

    *CSRF.* Every request other than GET, HEAD and OPTIONS behind a session
    must send the session's CSRF token in `X-CSRF-Token` (it is in the
    `csrfToken` field of `GET /api/me`); a missing or wrong token is 403 with
    `code: csrf`. There is no Origin or Referer check: the cookie is
    `SameSite=Lax`, `Secure`, `HttpOnly`, with the `__Host-` prefix.

    **Paths with a project.** A project path holds slashes
    (`acme/widgets`, or `group/subgroup/project` on GitLab). Send the slashes
    as they are, not as `%2F`. OpenAPI cannot say that a path parameter may
    hold slashes, so `{project}` below stands for such a path. The server
    registers one route with a `{rest...}` wildcard for each group of these
    (the `x-pergent-pattern` of each operation), and tells the operations
    apart by the end of the path.

    **Stability.** pergent.sh is 0.x. This API may change between minor
    versions. `internal/dashboard/openapi_test.go` fails when this file and the
    code disagree about routes, access gates, or the JSON fields of the
    schemas named after Go types.

    **Extensions.** `x-pergent-access` is how the router gates the route:
    `none` (the handler decides), `session` or `admin`. A handler
    can still ask for more (a repository role), which the description says.
    `x-pergent-pattern` names the registered `{rest...}` pattern an operation
    belongs to.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://pergent.example.com
    description: Your public_url (webhooks), callback_url (Job callbacks) or dashboard.url (dashboard).
tags:
  - name: Webhooks
    description: Events sent by GitLab and GitHub.
  - name: Job callbacks
    description: Results posted by Jobs that pergent.sh started.
  - name: Health
    description: The probe the kubelet calls.
  - name: Metrics
    description: Counters for Prometheus, on a port of their own.
  - name: Sign-in
    description: Dashboard sign-in and sign-out.
  - name: Overview and reviews
    description: The overview page, the reviews, their runs and the review page's buttons.
  - name: Repositories
    description: The repositories of an instance, their settings and readiness.
  - name: Skills
    description: The skill library, and installing skills from git.
  - name: Organization
    description: Users, teams and the audit log.
  - name: Usage
    description: What the reviews used, for admins.
  - name: Instances and settings
    description: Admin configuration.
security: []
paths:
  # ---------------------------------------------------------------- webhooks
  /webhooks/gitlab/{instance}:
    post:
      operationId: receiveGitLabWebhook
      tags: [Webhooks]
      summary: Receive a GitLab webhook
      description: |
        GitLab merge request (`Merge Request Hook`) and note (`Note Hook`)
        webhooks. Any other event is answered 200 and ignored. The
        `X-Gitlab-Token` header is compared in constant time with the
        instance's webhook secret; an instance with no secret refuses every
        request.

        An authenticated webhook whose payload cannot be used (not JSON, no
        project id or merge request iid, a malformed head SHA) is answered
        **200** with a warning in the log, because GitLab counts failed
        deliveries toward disabling the hook. The check order is: method
        (405 from the router), instance (404), token (401), event, body size
        (413), bytes buffered (503), body (400), payload.
      x-pergent-access: none
      security:
        - gitlabWebhookToken: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - name: X-Gitlab-Event
          in: header
          required: false
          description: Only `Merge Request Hook` and `Note Hook` are acted on.
          schema: {type: string}
      requestBody:
        required: true
        description: The GitLab event payload. At most 5 MiB.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Handled, or ignored (other event, unknown project, unusable payload). No body.
        '400': {$ref: '#/components/responses/PlainTextError'}
        '503':
          description: Too many bytes of webhook bodies are held at once. Sent with `Retry-After`.
          content:
            text/plain:
              schema: {type: string}
        '401':
          description: The token is missing or wrong (or the instance has no secret).
          content:
            text/plain:
              schema: {type: string}
        '404':
          description: No GitLab instance of that name.
          content:
            text/plain:
              schema: {type: string}
        '413':
          description: The body is over 5 MiB.
          content:
            text/plain:
              schema: {type: string}
        '500': {$ref: '#/components/responses/PlainTextError'}
  /webhooks/github/{instance}:
    post:
      operationId: receiveGitHubWebhook
      tags: [Webhooks]
      summary: Receive a GitHub webhook
      description: |
        The GitHub review App's `pull_request`, `issue_comment` and
        `pull_request_review_comment` webhooks (comments carry commands). Any
        other event, `ping` included, is answered 200 and ignored.
        `X-Hub-Signature-256` is `sha256=` and the hex HMAC-SHA256 of the raw
        body with the instance's webhook secret, compared in constant time; a
        missing or wrong signature, or an instance with no secret, is 401.
        A repository that is not switched on gets 200 and is ignored. An
        unusable payload is answered 200, as for GitLab.

        A `pull_request` delivery whose exact body was handled already, or whose
        pull request's `updated_at` is over 7 days old, is answered 200 and
        ignored: the signature has no time in it, so a captured delivery must
        not count again. A delivery that was answered 5xx can be sent again.

        The check order is: method (405 from the router), instance (404),
        signature's shape (401), body size (413), bytes buffered (503), body
        (400), signature (401), event, payload.
      x-pergent-access: none
      security:
        - githubWebhookSignature: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - name: X-GitHub-Event
          in: header
          required: false
          description: Only `pull_request`, `issue_comment` and `pull_request_review_comment` are acted on.
          schema: {type: string}
      requestBody:
        required: true
        description: The GitHub event payload. At most 5 MiB.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Handled, or ignored. No body.
        '400': {$ref: '#/components/responses/PlainTextError'}
        '503':
          description: Too many bytes of webhook bodies are held at once. Sent with `Retry-After`.
          content:
            text/plain:
              schema: {type: string}
        '401':
          description: The signature is missing or wrong (or the instance has no secret).
          content:
            text/plain:
              schema: {type: string}
        '404':
          description: No GitHub instance of that name.
          content:
            text/plain:
              schema: {type: string}
        '413':
          description: The body is over 5 MiB.
          content:
            text/plain:
              schema: {type: string}
        '500': {$ref: '#/components/responses/PlainTextError'}
  # ------------------------------------------------------------ job callbacks
  /runs/{id}/result:
    post:
      operationId: postRunResult
      tags: [Job callbacks]
      summary: Deliver a review result (pergent schema v1)
      description: |
        The review Job posts the result `pergent agent` produced, with the
        run's one-time bearer token. pergent is a CLI with no HTTP API of its
        own, so this is the only description of the call.

        The body is pergent's result schema version 1, documented in the
        pergent repository at
        [`docs/agent-result-schema.md`](https://github.com/gopaytech/pergent/blob/master/docs/agent-result-schema.md).
        `result.Result` lists only the fields pergent.sh reads; unknown fields
        are accepted and ignored, because version 1 only grows. A result must
        have `schema_version` 1, `status` `completed` or `error`, a
        non-empty `comment.markdown`, and for `completed` at least one skill.
        It must be for the run's own `base` and `head`, and for a completed
        result its skills must be those the Job was started with.

        The token is checked first, on the raw body, so a bad token can never
        fail anyone's run. After a good token, a body that is not JSON or not a
        usable result makes **the run fail** and is answered 400. Nothing sent
        here ever makes a run pass: an unusable result is a failed run.

        A 200 also answers a result for a run that was superseded (a newer
        push replaced it); the result is dropped.
      x-pergent-access: none
      security:
        - runResultToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The run's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: The result. At most 11 MiB (pergent caps its own at 10 MB).
        content:
          application/json:
            schema: {$ref: '#/components/schemas/result.Result'}
      responses:
        '200':
          description: The result was recorded (or dropped, for a superseded run). No body.
        '400':
          description: The body could not be read, is not JSON, or is not a usable result. The run is recorded as failed.
          content:
            text/plain:
              schema: {type: string}
        '401':
          description: The bearer token is missing, not this run's, expired, or the run is unknown.
          content:
            text/plain:
              schema: {type: string}
        '409':
          description: A result for this run was received already.
          content:
            text/plain:
              schema: {type: string}
        '413':
          description: The body is over 11 MiB.
          content:
            text/plain:
              schema: {type: string}
        '500': {$ref: '#/components/responses/PlainTextError'}
  /skill-fetches/{id}/result:
    post:
      operationId: postSkillFetchResult
      tags: [Job callbacks]
      summary: Deliver the skills a fetch Job read from a public URL
      description: |
        Posted once by a skill fetch Job with its one-time bearer token. Only
        registered when skill fetching is set up (the dashboard is on); else
        404. A body over 4 MiB makes the fetch fail at once (with the right
        token only) and is answered 413. Neither the token nor the body is
        logged.
      x-pergent-access: none
      security:
        - skillFetchToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The fetch's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/skillfetch.JobResult'}
      responses:
        '204':
          description: Recorded.
        '400': {$ref: '#/components/responses/PlainTextError'}
        '401':
          description: The bearer token is missing or is not this fetch's.
          content:
            text/plain:
              schema: {type: string}
        '409':
          description: The fetch has ended (a result came, or it gave up).
          content:
            text/plain:
              schema: {type: string}
        '413':
          description: The body is over 4 MiB.
          content:
            text/plain:
              schema: {type: string}
        '500': {$ref: '#/components/responses/PlainTextError'}
  /readiness-scans/{id}/result:
    post:
      operationId: postReadinessScanResult
      tags: [Job callbacks]
      summary: Deliver what a readiness scan Job found
      description: |
        Posted once by a readiness scan Job with its one-time bearer token.
        Only registered when readiness scans are set up (the dashboard is on);
        else 404. A body over 1 MiB makes the scan fail at once (with the
        right token only) and is answered 413.
      x-pergent-access: none
      security:
        - readinessScanToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The scan's id.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/readiness.JobResult'}
      responses:
        '204':
          description: Recorded.
        '400': {$ref: '#/components/responses/PlainTextError'}
        '401':
          description: The bearer token is missing or is not this scan's.
          content:
            text/plain:
              schema: {type: string}
        '409':
          description: The scan has ended.
          content:
            text/plain:
              schema: {type: string}
        '413':
          description: The body is over 1 MiB.
          content:
            text/plain:
              schema: {type: string}
        '500': {$ref: '#/components/responses/PlainTextError'}
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      description: Answers as soon as the server starts; the startup reconcile runs in the background.
      x-pergent-access: none
      security: []
      responses:
        '200':
          description: The text `ok`.
          content:
            text/plain:
              schema:
                type: string
                const: ok
  /metrics:
    get:
      operationId: getMetrics
      tags: [Metrics]
      summary: Prometheus metrics
      description: |
        Token, review, skill-run and finding counters and a gauge of the
        findings now dismissed, in the Prometheus text format (version 0.0.4),
        computed from the database at
        each scrape. Served only when `metrics_listen` is set, and only on that
        port: the main port (and so `public_url`) never answers it, and the
        metrics port answers nothing else. One scrape runs at a time: another
        that arrives meanwhile is a 503 with an empty body. A failure reading
        the database is a 500 with an empty body; the error is in the log.
      x-pergent-access: none
      security: []
      servers:
        - url: http://pergent-sh-metrics:9090
          description: The metrics_listen port, reached inside the cluster.
      responses:
        '200':
          description: The metrics.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: Another scrape is running. The body is empty.
        '500':
          description: The database could not be read. The body is empty.
  # --------------------------------------------------------------------- auth
  /auth/logout:
    post:
      operationId: signOut
      tags: [Sign-in]
      summary: Sign out
      description: |
        Ends the session and clears the cookie. When a session exists, the
        `X-CSRF-Token` header must carry its token. Without a session it still
        answers 204.
      x-pergent-access: none
      security:
        - {}
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Signed out. The session cookie is cleared.
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/csrf:
    get:
      operationId: getLoginCsrf
      tags: [Sign-in]
      summary: Get the password form's CSRF token
      description: Sets the `__Host-pergent_login_csrf` cookie (10 minutes) and returns the same token in the body.
      x-pergent-access: none
      security: []
      responses:
        '200':
          description: The token.
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CSRFTokenBody'}
  /auth/password:
    post:
      operationId: signInWithPassword
      tags: [Sign-in]
      summary: Sign in with a password
      description: |
        Needs the login CSRF cookie from `GET /auth/csrf` and the same token in
        `X-CSRF-Token`. Every failure, an unknown username included, is the
        same 401 after the same work. Five wrong passwords in a row lock the
        account for 15 minutes; each client IP has 20 attempts per 5 minutes
        (429). With no hashing slot free within 5 seconds the answer is 503.
      x-pergent-access: none
      security:
        - loginCsrfCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordSignInRequest'}
      responses:
        '204':
          description: Signed in.
          headers:
            Set-Cookie:
              description: The `__Host-pergent_session` cookie. The login CSRF cookie is cleared.
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: Wrong username or password, or the account is locked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          description: Too many sign-in attempts from this client.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: No hashing slot was free in time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  /auth/password/change:
    post:
      operationId: changePassword
      tags: [Sign-in]
      summary: Change the signed-in local admin's password
      description: |
        For a local admin (a password account) only (403 for an SSO account). A wrong
        current password counts toward the account's lock; while the account
        is locked every change is refused (401). The account's other sessions
        end. Allowed while the password change is still required.
      x-pergent-access: session
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      responses:
        '204':
          description: Changed.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: Not signed in, or the current password is wrong, or the account is locked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          description: Too many attempts from this client.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: No hashing slot was free in time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  /auth/oidc/login:
    get:
      operationId: oidcLogin
      tags: [Sign-in]
      summary: Start OIDC sign-in
      description: |
        Sends the browser to the identity provider's authorization endpoint
        (authorization code flow with PKCE, scopes `openid email`, a state and
        a nonce). Nothing in the request chooses where it goes. The state, the
        nonce and the PKCE verifier travel in the sealed, short-lived
        `__Host-pergent_oidc` cookie (`HttpOnly`, `Secure`, `SameSite=Lax`,
        10 minutes). When OIDC is not set up, or the provider cannot be read,
        the browser goes to `/sign-in?error=not_set_up` or
        `/sign-in?error=unavailable`.
      x-pergent-access: none
      security: []
      responses:
        '302':
          description: To the provider.
          headers:
            Location:
              schema: {type: string}
            Set-Cookie:
              description: The `__Host-pergent_oidc` state cookie.
              schema: {type: string}
        '303':
          description: To `/sign-in?error=<code>`.
          headers:
            Location:
              schema: {type: string}
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [Sign-in]
      summary: Finish OIDC sign-in
      description: |
        The provider sends the browser back here. In order: the `state` equals
        the cookie's (constant-time), the code is exchanged (with the PKCE
        verifier), and the ID token is checked: signature (asymmetric
        algorithms only), issuer, audience, expiry and nonce. Its `email` claim
        must be one email address and `email_verified` must be true. Then the
        allowlist decides: the email is on the exact list, or its domain is on
        the domain list (with Google as the issuer also the token's `hd` claim
        must equal the domain), or an admin added the account. Only then is an
        account made (a user with no team) and a session begun, ending the one
        the browser came with. The session ends after 8 hours idle or 24 hours.

        Every refusal answers `303` to `/sign-in?error=<code>`, with no account
        and no session. The codes are `expired` (state missing or wrong),
        `denied` (the provider reported an error), `failed` (the token or its
        email was refused), `not_allowed` (not on the allowlist: the page says
        to ask an admin), `not_set_up` and `unavailable`. Nothing from the
        provider is repeated.
      x-pergent-access: none
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '303':
          description: To `/` when signed in, else to `/sign-in?error=<code>`.
          headers:
            Location:
              schema: {type: string}
            Set-Cookie:
              description: The `__Host-pergent_session` cookie when signed in; the state cookie is cleared either way.
              schema: {type: string}
  /api/sign-in-options:
    get:
      operationId: getSignInOptions
      tags: [Sign-in]
      summary: What the sign-in pages offer
      description: |
        The only `/api/` route that needs no session. `/sign-in` (for users)
        shows the SSO button only; `/admin/sign-in` (for admins) shows the
        password form, and the button too when there is one. When OIDC sign-in
        is set up `sso` carries the label of the button, which goes to
        `GET /auth/oidc/login`. In JWT mode `jwt` is true and there is no
        button: a proxy signs people in, and loading a page starts the session.
        It names no instance, client or address.
      x-pergent-access: none
      security: []
      responses:
        '200':
          description: The password form, and the SSO button or the JWT mode.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/signInOptionsView'}
  /api/me:
    get:
      operationId: getMe
      tags: [Sign-in]
      summary: The signed-in user
      description: |
        Works for a waiting account and for a local admin that must change its
        password. Its `csrfToken` is the token writes send in
        `X-CSRF-Token`.

        With JWT sign-in this is also one of the two requests that can start a
        session (the other is a `GET` of a page): a valid token in the proxy's
        header and no session starts one, and the answer is the new session's
        user. A valid token for an email that is not allowed is 401 with
        `code` `not_allowed`. When the signing keys cannot be fetched the
        answer is 503 and no session ends. With `?probe=1` it never starts
        one (the admin sign-in page asks this way, so a local admin whose
        proxy identity is allowed can still reach the password form): with no
        session the answer is 401 whatever the header holds.
      x-pergent-access: session
      security:
        - sessionCookie: []
      parameters:
        - name: probe
          in: query
          required: false
          description: Set to `1` to ask without starting a session from the JWT header.
          schema: {type: string, enum: ['1']}
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/meView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: JWT sign-in only. The signing keys cannot be fetched and none is cached, so the token can't be checked. Nothing ends.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  # ------------------------------------------------------ overview and reviews
  /api/overview:
    get:
      operationId: getOverview
      tags: [Overview and reviews]
      summary: Numbers, recent reviews and setup problems
      description: |
        Numbers over the runs started in the last `days`, the 10 most recently
        updated reviews of the last 90 days, and the setup problems of the
        repositories the user can see. `setup` is the setup checklist for
        admins only, and null once all four items are done (and for everyone
        else).
      x-pergent-access: session
      security:
        - sessionCookie: []
      parameters:
        - name: days
          in: query
          description: How many days back the numbers count.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverviewView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/reviews:
    get:
      operationId: listReviews
      tags: [Overview and reviews]
      summary: List reviews
      description: |
        Merge requests and pull requests as their newest run left them, most
        recently updated first, 50 at most. `nextCursor`, when not empty, is
        passed as `cursor` for the next page.
      x-pergent-access: session
      security:
        - sessionCookie: []
      parameters:
        - name: project
          in: query
          description: Keep one repository (a path, on `instance` when that is given, else on any).
          schema: {type: string}
        - name: instance
          in: query
          schema: {type: string}
        - name: outcome
          in: query
          schema: {$ref: '#/components/schemas/Outcome'}
        - name: days
          in: query
          description: Leave out reviews last updated longer ago.
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 90
        - name: cursor
          in: query
          description: A `nextCursor` of an earlier answer.
          schema: {type: string}
      responses:
        '200':
          description: One page of reviews.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewListView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/reviews/{instance}/{project}/{number}:
    get:
      operationId: getReview
      tags: [Overview and reviews]
      summary: One review with every run of it
      description: The change and every run of it, newest first.
      x-pergent-access: session
      x-pergent-pattern: GET /api/reviews/{instance}/{rest...}
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/Number'
      responses:
        '200':
          description: The review.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewDetailView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/reviews/{instance}/{project}/{number}/rerun:
    post:
      operationId: rerunReview
      tags: [Overview and reviews]
      summary: Run the review again
      description: |
        Re-runs against the change's head on the platform now, the whole
        review or only its failed skills. The body may be left out (a re-run
        of everything). For maintainers and admins of the repository (403
        otherwise), config repositories included. The change must be open
        (409), and a draft only where drafts are reviewed (409). At a re-run
        cap the answer is 429.
      x-pergent-access: session
      x-pergent-pattern: POST /api/reviews/{instance}/{rest...}
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/Number'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RerunRequest'}
      responses:
        '202':
          description: |
            `status` is `queued`, `already queued` (the head is queued or
            running), `nothing failed` or `whole review`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusBody'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: A re-run cap (per change or per repository and UTC day) is reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/reviews/{instance}/{project}/{number}/start:
    post:
      operationId: startReview
      tags: [Overview and reviews]
      summary: Start the review of an untrusted author's change
      description: |
        For a change whose newest run waits because the repository doesn't
        trust its author (409 otherwise): starts the review of the change's
        head on the platform now, like `@<bot> review` from someone with write
        access. The body names the head the page showed (`WaitingView.head`):
        when the change has been pushed since, nothing starts (409). For
        maintainers and admins of the repository (403 otherwise). The change
        must be open (409), and a draft only where drafts are reviewed (409). A start counts against the
        change's re-run cap only (429), not the repository's.
      x-pergent-access: session
      x-pergent-pattern: POST /api/reviews/{instance}/{rest...}
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/Number'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartRequest'}
      responses:
        '202':
          description: '`status` is `queued` or `already queued`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusBody'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: The change's re-run cap for the UTC day is reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/reviews/{instance}/{project}/{number}/dismiss:
    post:
      operationId: dismissFinding
      tags: [Overview and reviews]
      summary: Dismiss a finding of the latest review
      description: |
        For maintainers of the repository and admins (403 otherwise). A
        blocking finding needs a `reason` (up to 500 characters) and is not
        dismissed on a merged or closed change (409); when the platform cannot
        say what state the change is in, the answer is 502. The change's author
        may dismiss too: an account has no platform identity to tell it by. A
        suggestion needs no reason. The review is decided again with the
        dismissal.
      x-pergent-access: session
      x-pergent-pattern: POST /api/reviews/{instance}/{rest...}
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/Number'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DismissRequest'}
      responses:
        '200':
          description: '`status` is `dismissed` or `already dismissed`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusBody'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/reviews/{instance}/{project}/{number}/restore:
    post:
      operationId: restoreFinding
      tags: [Overview and reviews]
      summary: Undo a dismissal
      description: For maintainers and admins of the repository (403 otherwise). The review is decided again.
      x-pergent-access: session
      x-pergent-pattern: POST /api/reviews/{instance}/{rest...}
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/Number'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RestoreRequest'}
      responses:
        '200':
          description: '`status` is `restored` or `not dismissed`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusBody'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/runs/{id}:
    get:
      operationId: getRun
      tags: [Overview and reviews]
      summary: One run with its skills, findings and files
      description: |
        A run without a usable result has no skills or files; its `reason` and
        `approvalReason` say why. Dismissals are shown on the change's latest
        decided run only (`latestDecided`).
      x-pergent-access: session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunDetailView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/runs/{id}/log:
    get:
      operationId: getRunLog
      tags: [Overview and reviews]
      summary: The redacted tail of a run's Job log
      x-pergent-access: session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The log text.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No such run, or no log was kept.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
        '500': {$ref: '#/components/responses/InternalError'}
  # ------------------------------------------------------------- repositories
  /api/repositories:
    get:
      operationId: listRepositories
      tags: [Repositories]
      summary: List the repositories switched on that the user can see
      x-pergent-access: session
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The repositories.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RepositoryView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: switchOnRepository
      tags: [Repositories]
      summary: Switch a repository on
      description: |
        Admins only. The repository is checked on its own, not against the
        picker's lists: the instance's review bot (GitLab: Maintainer or
        above) or App (GitHub: installed) must reach it, else 404 whether it
        is on or not (404 also for an instance that is not there); then 409
        when it is on already, or set up by the config. Nothing asks what the
        admin may read on the platform. Every setting starts at its default;
        pergent.sh sets up the webhook and clone credentials within seconds.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SwitchOnRequest'}
      responses:
        '201':
          description: Switched on. The project is spelled as GitLab spells it for GitLab, and as sent (trimmed) for GitHub.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryDetailView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/repositories/available:
    get:
      operationId: listAvailableRepositories
      tags: [Repositories]
      summary: Repositories that can be switched on (the picker)
      description: |
        Admins only: one page of the repositories of one instance that its
        review bot or App reaches and that are not switched on (the same list
        as `GET /api/admin/instances/{name}/repositories`). A page holds 50
        at most. On GitLab a page is one request to GitLab in its ID order (so no
        project falls between two pages), sorted by path within the page, and
        a page with switched-on projects left out holds fewer than 50; on
        GitHub, which cannot search on its side, the list is read whole,
        sorted, cut into pages of 50, and the switched-on ones are left out of
        each page after. `hasMore` says whether to ask for the next
        page. `truncated` is true when the list a page is made from was too
        long (5000) or too slow (20 s) to read whole (GitHub only). 400
        without an `instance` or with a bad `page`, 404 for an instance that
        is not there.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      parameters:
        - name: instance
          in: query
          required: true
          description: The instance whose repositories are listed.
          schema: {type: string}
        - name: search
          in: query
          description: Keep repositories whose path holds this (GitLab also matches names).
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/AvailablePage'
      responses:
        '200':
          description: One page of the repositories.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailableView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502':
          description: GitLab or GitHub could not be asked, or nothing could be read in time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  /api/admin/linkable:
    get:
      operationId: listLinkableRepositories
      tags: [Repositories]
      summary: Repositories a repository may link (the links picker)
      description: |
        Admins only: the repositories the instance's review App reaches
        (the picker's list, kept 5 minutes, 200 at most by name), each with
        whether `repo` may link it, and why not. Itself, ones already linked
        and the third link's limit are told without a read. For the others the
        visibility and installation are read once each, 8 at a time within 12
        seconds and kept 5 minutes; one not read in time, or whose read failed,
        comes back unchecked and is checked again by the save of the links.
        400 without `instance` and `repo`, or for a GitLab repository; 404 for
        an instance or a repository switched on that is not there; 502 when
        the platform cannot be asked.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      parameters:
        - name: instance
          in: query
          required: true
          schema: {type: string}
        - name: repo
          in: query
          required: true
          description: The repository that would link, `owner/name`, switched on.
          schema: {type: string}
        - name: search
          in: query
          description: Keep repositories whose path holds this.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: The repositories.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LinkableView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502':
          description: The platform could not be asked, or nothing could be read.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  /api/repositories/{instance}/{project}:
    get:
      operationId: getRepository
      tags: [Repositories]
      summary: One repository with its settings
      description: |
        `settings` is keyed `approve`, `reviewDrafts`, `inlineFindings`,
        `commandsAuthorAndMaintainersOnly`, `incrementalReviews`,
        `learnFromDismissals`, `quietReviews`, `commentLayout` (the
        `block:state` list; while `overridden` is false it is the default in
        effect: the admin default, else the built-in layout),
        `linkedReposEnabled` (the impact check across linked repositories;
        off unless set), `linkedRepos` (the links, a list of `LinkView`:
        shown to admins only, an empty list to anyone else; `overridden` is
        true while the repository has any),
        `failureStatus`, `skills`
        (null: the default list), `repoSkills`, `jobTimeoutSeconds`,
        `maxTurns`, `jobMemory`
        (`""` when none), `rerunLimitPerMR`, `rerunLimitPerRepo`,
        `trustedAuthorsOnly` (the mode in effect) and `trustedAuthors`; each
        value says whether the repository sets it (`overridden`) or follows
        the default.
      x-pergent-access: session
      x-pergent-pattern: GET /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: The repository.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryDetailView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: switchOffRepository
      tags: [Repositories]
      summary: Switch a repository off
      description: |
        Admins only (404 for anyone else). A repository set up in
        the config file is 409: remove it from the config. pergent.sh removes
        its webhook and clone credentials.
      x-pergent-access: admin
      x-pergent-pattern: DELETE /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: Switched off. `repo.on` is false and the settings are the defaults.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryDetailView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/repositories/{instance}/{project}/inputs:
    get:
      operationId: getRepositoryInputs
      tags: [Repositories]
      summary: The skills and instructions a review would get
      description: |
        Read from the default branch with the review bot or App and kept 5
        minutes (a change of a skill setting or of the default list clears
        it). 503 while pergent.sh has not set the repository up yet; 502 when
        they cannot be read.
      x-pergent-access: session
      x-pergent-pattern: GET /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: The inputs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InputsView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503':
          description: The repository is not set up yet (reconcile has not reached it).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  /api/repositories/{instance}/{project}/readiness:
    get:
      operationId: getRepositoryReadiness
      tags: [Repositories]
      summary: The Readiness tab
      description: |
        For anyone who can see the repository. `checklist` is built now from
        the latest finished scan's stored results and the skills turned on
        now; it is null until a scan has finished. Nothing here asks the
        platform or the cluster.
      x-pergent-access: session
      x-pergent-pattern: GET /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: The scans and the checklist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/repositories/{instance}/{project}/past-dismissals:
    get:
      operationId: listPastDismissals
      tags: [Repositories]
      summary: Dismissals that teach the repository's reviews
      description: |
        For maintainers and admins of the repository (403 for a viewer). One
        row per finding whose dismissals teach, a blocking dismissal over a
        suggestion and then the newest. The list is `[]` when nothing teaches.
      x-pergent-access: session
      x-pergent-pattern: GET /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: The rows.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PastDismissalView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/repositories/{instance}/{project}/skill-results:
    get:
      operationId: listSkillResults
      tags: [Repositories]
      summary: What became of each skill's findings
      description: |
        For anyone who can see the repository. Findings of one skill at one
        severity that were decided in the window. `addressed` is
        `fixed * 100 / raised`, a whole percent, null under 10 raised. Rows come
        lowest `addressed` first, nulls last, then by skill, a blocking row
        before a suggestion. `[]` when nothing was decided.
      x-pergent-access: session
      x-pergent-pattern: GET /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
        - name: days
          in: query
          description: The window. Any other value is 400.
          schema:
            type: integer
            enum: [30, 90]
            default: 30
      responses:
        '200':
          description: The rows.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SkillResultView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/repositories/{instance}/{project}/skill-results/tokens:
    get:
      operationId: listSkillResultTokens
      tags: [Usage]
      summary: What each skill used on the changes the Skill results tab counts
      description: |
        Admins only (404 for anyone else, as for an unknown repository). The
        tokens, input and output, each skill used on the changes that
        `GET /api/repositories/{instance}/{project}/skill-results` counts for
        the same window: the changes merged in it that a person opened, and
        the changes closed in it that hold a dismissal. A change merged with no
        findings is counted too, whoever opened it, since a bot is known only
        from findings. All the reviews of a change count, not only those inside
        the window. Rows come by skill, and the list is `[]` when no change was
        counted or none has recorded usage.
      x-pergent-access: session
      x-pergent-pattern: GET /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
        - name: days
          in: query
          description: The window. Any other value is 400.
          schema:
            type: integer
            enum: [30, 90]
            default: 30
      responses:
        '200':
          description: The rows.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SkillTokensView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/repositories/{instance}/{project}/usage:
    get:
      operationId: getRepositoryUsage
      tags: [Usage]
      summary: What a repository used
      description: |
        Admins only (404 for anyone else, as for an unknown repository), and
        only for a repository that is switched on. Tokens used in the last
        `days` days, counted as in `GET /api/admin/usage`: each day, each
        skill and each model busiest first, and the 50 busiest merge requests
        with the title and address of their latest review. `skills[].failed`
        counts the runs in which the skill failed; it is 0 for a model.
        `wasted.failed` is the tokens of skills that failed. `wasted.reruns`
        is the tokens of re-runs someone asked for (a rerun or a rerun of the
        failed skills), apart and not waste; a skill that failed in a re-run is
        in both. `noResult` counts reviews that left no result and
        `superseded` those stopped by a newer push before one, whose tokens are
        unknown. `fullMedian` and `incrementalMedian` are the median tokens of
        a full review and of an incremental one, null with none of that kind
        (a re-run of only the failed skills is neither). `outliers` are the
        reviews above three times their kind's median, costliest first, 20 at
        most. A repository with no stored project ID has empty lists.
      x-pergent-access: session
      x-pergent-pattern: GET /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/UsageDays'
      responses:
        '200':
          description: The usage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageRepositoryView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/repositories/{instance}/{project}/teams:
    get:
      operationId: getRepositoryTeams
      tags: [Repositories]
      summary: The teams of a repository
      description: |
        Admins only (404 for anyone else, as for an unknown repository). Every
        team by name ignoring case, with whether it lists this repository
        itself (`direct`) or covers every repository of its instance
        (`wholeInstance`). It reads the same rows as the Teams page.
      x-pergent-access: session
      x-pergent-pattern: GET /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: The teams.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepoTeamsView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: putRepositoryTeams
      tags: [Repositories]
      summary: Set the teams that list a repository
      description: |
        Admins only (404 for anyone else). `teams` are the IDs of the teams
        that list this repository themselves: a team in the list that does not
        yet gets the repository, one that has it and is not in the list loses
        it. A team's other repositories and its whole-instance cover stay. A
        team that is not there is 400 and nothing changes. A repository set up
        in the config file can be given to teams too. Each team changed is an
        audit entry.
      x-pergent-access: session
      x-pergent-pattern: PUT /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutRepositoryTeamsRequest'}
      responses:
        '200':
          description: The teams after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepoTeamsView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/repositories/{instance}/{project}/settings:
    put:
      operationId: updateRepositorySettings
      tags: [Repositories]
      summary: Change some settings of a repository
      description: |
        For maintainers and admins of the repository (403 otherwise). Changes
        the settings in the body and leaves the others; a null resets one to
        its default. A repository set up in the config file is 409. Only an
        admin of the repository changes the two re-run caps (403 otherwise).
        Any other key, or a value out of bounds, is 400 and nothing changes.
        A list of `skills` must name library skills (400 `skill "x" is not in
        the skill library`), and the texts of the list may not come to more
        than 900 KiB.
      x-pergent-access: session
      x-pergent-pattern: PUT /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
      requestBody:
        required: true
        description: At most 64 KiB.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RepositorySettingsRequest'}
      responses:
        '200':
          description: The repository with its new settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryDetailView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/repositories/{instance}/{project}/settings/reset:
    post:
      operationId: resetRepositorySettings
      tags: [Repositories]
      summary: Put every setting back to its default
      description: |
        For maintainers and admins of the repository (403 otherwise). A
        maintainer's reset leaves the two re-run caps as they are; only an
        admin of the repository resets those. A repository set up in the
        config file is 409. Any POST to a repository path that is not one of
        the three below is 404.
      x-pergent-access: session
      x-pergent-pattern: POST /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: The repository with its default settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryDetailView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/repositories/{instance}/{project}/readiness/scan:
    post:
      operationId: scanRepositoryNow
      tags: [Repositories]
      summary: Scan the repository now
      description: |
        For maintainers and admins of the repository (403 otherwise), config
        repositories included. A repository that is not switched on, or when
        scans are off, is 404 and nothing is queued. 409 while a scan is
        queued or running; 429 within 5 minutes of the latest scan, with a
        `Retry-After` header.
      x-pergent-access: session
      x-pergent-pattern: POST /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '202':
          description: The scan is queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScanStartedBody'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: A scan is already queued or running. `scan` is that scan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScanBusyBody'}
        '429':
          description: The repository was scanned less than 5 minutes ago.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScanTooSoonBody'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/repositories/{instance}/{project}/past-dismissals/stop:
    post:
      operationId: stopUsingPastDismissal
      tags: [Repositories]
      summary: Stop teaching reviews from a finding's dismissals
      description: |
        For maintainers and admins of the repository (403 otherwise), config
        repositories included. Every dismissal of that finding in the
        repository stops teaching. The dismissals stay on their changes, no
        review is decided again and the platform is not asked.
      x-pergent-access: session
      x-pergent-pattern: POST /api/repositories/{instance}/{rest...}
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/ProjectPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StopUsingRequest'}
      responses:
        '200':
          description: '`status` is `stopped` or `not teaching`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusBody'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  # ------------------------------------------------------------------- skills
  /api/skills:
    get:
      operationId: listSkills
      tags: [Skills]
      summary: List the skill library
      description: |
        Without the skills' text, by name. `updatedBy` is shown to admins only.
        The `source` repository of an installed skill is hidden (`hidden`)
        from users who cannot see that repository.
      x-pergent-access: session
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The library.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LibrarySkillView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/skills/{name}:
    get:
      operationId: getSkill
      tags: [Skills]
      summary: One skill with its text and versions
      description: The text is to be shown as plain text only. Versions are newest first.
      x-pergent-access: session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SkillName'
      responses:
        '200':
          description: The skill.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillDetailView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/skills/{name}/versions/{v}:
    get:
      operationId: getSkillVersion
      tags: [Skills]
      summary: One saved version of a skill, with its text
      description: The history outlives a deleted skill.
      x-pergent-access: session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SkillName'
        - name: v
          in: path
          required: true
          description: The version number.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillVersionDetailView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/skills:
    post:
      operationId: createSkill
      tags: [Skills]
      summary: Add a skill to the library
      description: |
        Admins only; any admin writes the library. The text is checked as a
        skill and against the secrets pergent.sh holds (400, the answer names
        no secret). A taken name is 409; a full library is 400. With
        `addToDefaults`, over the review's size budget the create is refused
        whole (400).
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        description: At most 1 MiB.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSkillRequest'}
      responses:
        '201':
          description: Saved as version 1.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillWrittenView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/skills/{name}:
    put:
      operationId: updateSkill
      tags: [Skills]
      summary: Save a new version of a skill
      description: |
        Admins only. `version` is the version the editor opened: if the skill
        changed since, the answer is 409. A skill installed from git cannot be
        edited (409): copy it.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/SkillName'
      requestBody:
        required: true
        description: At most 1 MiB.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSkillRequest'}
      responses:
        '200':
          description: Saved. `version` is the new one.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillWrittenView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteSkill
      tags: [Skills]
      summary: Delete a skill
      description: |
        Admins only. A skill that a repository or the default list names is
        409, with the repositories the caller can see in the body.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/SkillName'
      responses:
        '204':
          description: Deleted.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The skill is in use.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillInUseView'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/skills/{name}/copy:
    post:
      operationId: copySkill
      tags: [Skills]
      summary: Copy a skill under a new name
      description: Admins only. The copy's frontmatter `name` is set to the new name.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/SkillName'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopySkillRequest'}
      responses:
        '201':
          description: Saved as version 1 of the new name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillWrittenView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/skill-fetches:
    post:
      operationId: startSkillFetch
      tags: [Skills]
      summary: Read a skill source (a repository of an instance, or a public URL)
      description: |
        Admins only. Starts a read of a folder of skills; poll
        `GET /api/admin/skill-fetches/{id}`. It reads any repository the
        instance's review bot or App reaches (400 without an instance and a
        repository, or a URL); nothing asks what the admin may read on the
        platform. A URL is read by a token-less Job. 503 when installing skills
        is not set up.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartSkillFetchRequest'}
      responses:
        '202':
          description: The read was started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillFetchStartedView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503':
          description: Installing skills is not set up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  /api/admin/skill-fetches/{id}:
    get:
      operationId: getSkillFetch
      tags: [Skills]
      summary: Read a skill fetch
      description: |
        Admins only, and only the admin who started the read (404 for anyone
        else, and after the read is no longer kept).
      x-pergent-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/FetchId'
      responses:
        '200':
          description: The read.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillFetchView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/skill-fetches/{id}/install:
    post:
      operationId: installSkills
      tags: [Skills]
      summary: Install skills from a finished read
      description: |
        Admins only, for the admin who started the read. Each skill is checked
        again (the skill checks and the held secrets, failing closed). The
        read must be done (409 while it runs or after it failed). The answer is
        a list with one entry per name, in the order asked.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FetchId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstallSkillsRequest'}
      responses:
        '200':
          description: One result for each name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SkillFetchResultView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/skill-fetches/{id}/update:
    post:
      operationId: updateSkills
      tags: [Skills]
      summary: Update installed skills from a finished check for updates
      description: |
        Admins only, for the admin who started the read. The read must be a
        check for updates (`purpose` `update`; else 409) and done. The answer
        is a list with one entry per name, in the order asked.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FetchId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSkillsRequest'}
      responses:
        '200':
          description: One result for each name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SkillFetchResultView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  # ------------------------------------------------------------- organization
  /api/users:
    get:
      operationId: listUsers
      tags: [Organization]
      summary: List accounts
      description: |
        Admins only. Everyone by username: the local admins and the SSO
        accounts, each with its role. An SSO account an admin added that has
        not signed in is `invited`; one that signed in, is no admin and is on no
        team is `waiting`. The old platform accounts are left out.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/UserView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/users/{id}:
    delete:
      operationId: deleteUser
      tags: [Organization]
      summary: Remove an account
      description: |
        Admins only. Removes the account with its sessions and team
        memberships (an SSO account is made again, on no team, at its next
        sign-in if the allowlist lets it in). Your own account is 409, and so is
        the last local admin.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '204':
          description: Removed.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/users:
    post:
      operationId: addUser
      tags: [Organization]
      summary: Add a user by email
      description: |
        Admins only. Gives a person access before they have signed in: makes
        the SSO account as `invited` (an admin added it, so the allowlist
        lets that email in whatever it says) and puts it on each team in
        `teams` with its role (`viewer` when none). The email is lower-cased
        with ASCII rules and must be exactly one address (400). A team that is
        not there, a role that is not `viewer` or `maintainer` and a team
        named twice are 400, and nothing is made. An email added already is
        409. An account that signed in earlier without being added is marked
        added and answered 200. If a team cannot be written after the account
        was made, the answer is 500 and the account stays: put it on teams
        from the Teams page.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddUserRequest'}
      responses:
        '200':
          description: The account existed and is now marked added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserView'}
        '201':
          description: Added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/users/{id}/role:
    put:
      operationId: setUserRole
      tags: [Organization]
      summary: Make an SSO account an admin or a user
      description: |
        Admins only. The account's next request reads the new role. Your own
        role cannot be changed (409), so one admin always stays to change the
        others'; a local admin is always an admin (409). The old platform
        accounts are 404.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetAccountRoleRequest'}
      responses:
        '204':
          description: The role is set.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/accounts:
    post:
      operationId: createPasswordAccount
      tags: [Organization]
      summary: Add a local admin
      description: |
        Admins only. Makes a local admin with a generated password,
        which must be changed at its first sign-in. The password is in the
        answer only, once: it is never logged or audited. The username is 1 to
        64 letters, digits, `.`, `_` or `-` (400), not taken ignoring case
        (409).
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAccountRequest'}
      responses:
        '201':
          description: Created. The only time the password is shown.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NewAccountView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: No hashing slot was free in time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  /api/teams:
    get:
      operationId: listTeams
      tags: [Organization]
      summary: List teams
      description: |
        Admins only, by name ignoring case. Each team with its members, each
        with a role on the team, and the repositories it covers.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The teams.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TeamView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createTeam
      tags: [Organization]
      summary: Add a team
      description: Admins only. A team with no members and no repositories. A name taken ignoring case is 409.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTeamRequest'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/teams/{id}:
    put:
      operationId: updateTeam
      tags: [Organization]
      summary: Replace a team's name, members and repositories
      description: |
        Admins only. Members are SSO accounts (400 otherwise), each with the
        role `viewer` or `maintainer` on this team (400 otherwise); an account
        named twice has the higher role. A repository is one switched on, or
        `{"instance": X, "project": ""}` for every repository of instance X,
        which also covers repositories switched on later (400 otherwise).
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTeamRequest'}
      responses:
        '200':
          description: The team as saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteTeam
      tags: [Organization]
      summary: Remove a team
      description: |
        Admins only. Removes the team, not its members' accounts.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '204':
          description: Removed.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/audit:
    get:
      operationId: listAudit
      tags: [Organization]
      summary: Read the audit log
      description: |
        Admins only. 100 entries at most, newest first, older than `before`
        when given. `next` is the `before` of the page after, 0 at the end of
        the log. Every admin sees every entry. `detail` never holds a secret.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      parameters:
        - name: before
          in: query
          description: The id of an audit entry; older entries are returned.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPageView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/usage:
    get:
      operationId: getUsage
      tags: [Usage]
      summary: What every repository used
      description: |
        Admins only. Tokens used in the last `days` days: the total, each UTC
        day (a day with no usage is left out, oldest first) and the
        repositories, busiest first. Every total and ranking adds input and
        output tokens only; `cacheRead`, `cacheWrite` and `reasoning` are
        shown apart. `unknown` counts the review-and-skill rows whose pergent
        did not report those three counts, so a result from an older pergent
        is unknown and never zero. `reviews` counts a review once, however
        many skills it ran. A repository switched off since, or on an
        instance that was removed, is listed with `switchedOn` false: its
        usage is kept. A repository is told by its instance and its path
        ignoring case.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UsageDays'
      responses:
        '200':
          description: The usage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageOverviewView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/usage.csv:
    get:
      operationId: exportUsageCsv
      tags: [Usage]
      summary: Export usage as CSV
      description: |
        Admins only. One row a run and skill, oldest first, in the last `days`
        days, for every repository or, with `instance` and `project`, for one
        (a repository that is not stored is the header alone). `instance` and
        `project` go together: one without the other is 400. Columns:
        `reported_at` (RFC 3339, UTC), `instance`, `repository` (the path the
        run was reported under), `merge_request` (its number), `trigger`,
        `incremental`, `model`, `skill`, `verdict`, `tokens_in`, `tokens_out`,
        `cache_read`, `cache_write`, `reasoning` (empty when pergent did not
        report them), `findings` and `blocking`. There are no titles and no
        text a person wrote, and no dismissals. A text cell that starts with
        `=`, `+`, `-`, `@`, a tab or a carriage return gets a `'` in front, so
        that a spreadsheet does not read it as a formula. The rows are streamed
        and stop at 200,000, with no mark. If the stream fails after it began,
        the response ends without its last chunk, so the download fails.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UsageDays'
        - name: instance
          in: query
          description: The instance of one repository; with `project`.
          schema: {type: string}
        - name: project
          in: query
          description: The path of one repository; with `instance`.
          schema: {type: string}
      responses:
        '200':
          description: The CSV, with a header row. Sent as an attachment named `pergent-usage-<days>d.csv`.
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  # ------------------------------------------------- instances and settings
  /api/admin/settings:
    get:
      operationId: getAdminSettings
      tags: [Instances and settings]
      summary: Defaults and model, for the Settings page
      description: Admins only. The defaults a repository switched on in the dashboard gets, and the model. Never a key.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/instances:
    get:
      operationId: listInstances
      tags: [Instances and settings]
      summary: List the configured instances
      description: Admins only. The config's first, then those added in the dashboard. Secrets are write-only.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The instances.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/InstanceAdminView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: addInstance
      tags: [Instances and settings]
      summary: Add an instance
      description: |
        Admins only. Checks the credentials the way startup does (400 with
        the reason when they fail, and nothing is stored), stores them sealed
        and connects. A GitLab instance's `webhook_secret` is generated; giving
        one is 400. A name taken in the config or the dashboard is 409. The
        check can take up to 40 seconds.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInstanceRequest'}
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstanceAdminView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/instances/{name}:
    put:
      operationId: updateInstance
      tags: [Instances and settings]
      summary: Change an instance's secrets
      description: |
        Admins only. Replaces what it names, checks the whole, connects
        again. An address or App ID that differs is 400. An instance of the
        config, or one being removed, is 409.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstancePathName'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateInstanceRequest'}
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstanceAdminView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: removeInstance
      tags: [Instances and settings]
      summary: Remove an instance
      description: |
        Admins only. Its runs are superseded and its repositories (and any
        old platform accounts and sessions of it) go now; pergent.sh takes the
        webhooks off the platform and
        deletes the instance and its secrets within a minute or so. An
        instance of the config is 409.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstancePathName'
      responses:
        '202':
          description: '`status` is `removing`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusBody'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/instances/{name}/trusted-authors:
    put:
      operationId: setInstanceTrustedAuthors
      tags: [Instances and settings]
      summary: Set an instance's trusted-authors default
      description: |
        Admins only. The default of the instance's repositories:
        `follow_visibility` (on for a public repository, off otherwise), `on`
        or `off`. A repository's own setting wins over it. An instance of the
        config (set `trusted_authors_only` there), or one being removed, is 409.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/InstancePathName'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstanceTrustRequest'}
      responses:
        '204': {description: Set.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/instances/{name}/repositories:
    get:
      operationId: listInstanceRepositories
      tags: [Instances and settings]
      summary: Repositories an instance's bot or App can set up
      description: |
        Admins only: one page of the repositories the instance's review bot or
        App can set up that are not switched on, 50 at most (see
        `GET /api/repositories/available`, the same list).
      x-pergent-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstancePathName'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/AvailablePage'
      responses:
        '200':
          description: One page of the repositories.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailableView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/admin/llm:
    get:
      operationId: getLLM
      tags: [Instances and settings]
      summary: The model reviews use
      description: Admins only. Whether a key is set and when it changed; never the key.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LLMAdminView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: putLLM
      tags: [Instances and settings]
      summary: Set the model reviews use
      description: |
        Admins only. 409 when the config has an `llm:` block. The key is
        needed only when none is stored; a key sent is sealed and never
        returned.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutLLMRequest'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LLMAdminView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/sign-in:
    get:
      operationId: getSignIn
      tags: [Instances and settings]
      summary: How people sign in
      description: |
        Admins only. The OIDC or JWT settings in force and the allowlist. The
        client secret is never sent, only whether one is set. `source` is
        `config` when `dashboard.sign_in` in the config file sets them: they are
        then read-only. `callbackURL` is the redirect URI to register at the
        identity provider.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignInAdminView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: putSignIn
      tags: [Instances and settings]
      summary: Set how people sign in
      description: |
        Admins only; 409 when the config file sets `dashboard.sign_in`.
        Issuer and JWKS URLs must be `https`. `clientSecret` is sealed and never
        returned; leave it out to keep the stored one, send `""` to remove it.
        OIDC needs one. Changing the mode or the issuer ends every OIDC and JWT
        session (a local admin's stays), and changing the issuer needs the
        client secret entered again: a stored secret is dropped when the issuer
        changes, so it is never sent to a new token endpoint. Emails are
        lower-cased (ASCII only) and domains too; lists hold at most 500 entries.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutSignInRequest'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignInAdminView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/sign-in/test:
    post:
      operationId: testSignIn
      tags: [Instances and settings]
      summary: Test the identity provider
      description: |
        Admins only. Reads the OIDC discovery document (mode `oidc`) or the JWKS
        (mode `jwt`) and says only whether that worked: nothing the other side
        sent comes back, no status, error text, document or address. The body is
        optional; what it leaves out is taken from the settings in force.
        A 400 is for an address that is not `https`, or nothing to test.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TestSignInRequest'}
      responses:
        '200':
          description: Whether it worked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignInTestView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/admin/defaults:
    get:
      operationId: getDefaults
      tags: [Instances and settings]
      summary: The defaults of repositories switched on in the dashboard
      description: Admins only.
      x-pergent-access: admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The defaults.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DefaultsView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: putDefaults
      tags: [Instances and settings]
      summary: Replace the defaults
      description: |
        Admins only. Replaces them all: a missing key or null is the built-in
        default. The exception is `skills`, the default list of library skill
        names: a missing key keeps the stored list, null or `[]` clears it, and
        a name the library lacks or a list over 900 KiB is 400.
      x-pergent-access: admin
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DefaultsRequest'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DefaultsView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-pergent_session
      description: |
        The dashboard session, set by sign-in (`GET /auth/oidc/callback` or
        `POST /auth/password`). 32 random bytes, base64url. `HttpOnly`,
        `Secure`, `SameSite=Lax`, `Path=/`. It ends after 8 hours idle, or after
        7 days for a local admin and 24 hours for a session that began with OIDC
        or a JWT.
        A missing, unknown or ended session is 401 with `{"error": "not signed in"}`
        or `"session expired"`. With JWT sign-in every request of a session that
        a JWT started also needs a valid token for the same email in the
        proxy's header, or the session ends (401); with the signing keys down
        the answer is 503 and it does not end.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The session's CSRF token (`csrfToken` of `GET /api/me`), required with
        the session cookie on every request that is not GET, HEAD or OPTIONS
        (403, `code: csrf`, otherwise). For the password sign-in form it is the
        token of `GET /auth/csrf`, which must equal the `loginCsrfCookie`.
    loginCsrfCookie:
      type: apiKey
      in: cookie
      name: __Host-pergent_login_csrf
      description: Set by `GET /auth/csrf`. `HttpOnly`, `Secure`, `SameSite=Strict`, 10 minutes.
    gitlabWebhookToken:
      type: apiKey
      in: header
      name: X-Gitlab-Token
      description: The instance's webhook secret, compared in constant time. An instance with no secret refuses every request.
    githubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: |
        `sha256=` and the hex HMAC-SHA256 of the raw request body with the
        instance's webhook secret, compared in constant time. An instance with
        no secret refuses every request.
    runResultToken:
      type: http
      scheme: bearer
      description: |
        The review Job's one-time token, made when the Job was dispatched
        (stored as a SHA-256, valid for a limited time). It opens this run's
        result route only.
    skillFetchToken:
      type: http
      scheme: bearer
      description: The skill fetch Job's one-time token. It opens this fetch's result route only.
    readinessScanToken:
      type: http
      scheme: bearer
      description: The readiness scan Job's one-time token. It opens this scan's result route only.
  parameters:
    InstanceName:
      name: instance
      in: path
      required: true
      description: The instance's name, as in the config or the dashboard.
      schema: {type: string}
    InstancePathName:
      name: name
      in: path
      required: true
      description: The instance's name.
      schema: {type: string}
    UsageDays:
      name: days
      in: query
      description: How many days back the usage counts. Any other value is 400.
      schema:
        type: integer
        minimum: 1
        maximum: 90
        default: 30
    AvailablePage:
      name: page
      in: query
      description: The page of the list, 1 when left out. 400 for anything but a whole number from 1 to 10000.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    ProjectPath:
      name: project
      in: path
      required: true
      description: |
        The repository's path, slashes sent as they are (`acme/widgets`). It
        stands for the part of the path between the instance and the end that
        names the operation.
      schema: {type: string}
    Number:
      name: number
      in: path
      required: true
      description: The merge request's IID or the pull request's number.
      schema:
        type: integer
        format: int64
        minimum: 1
    RunId:
      name: id
      in: path
      required: true
      description: The run's id.
      schema:
        type: string
        format: uuid
    FetchId:
      name: id
      in: path
      required: true
      description: The skill fetch's id.
      schema:
        type: string
        format: uuid
    NumericId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SkillName:
      name: name
      in: path
      required: true
      description: The skill's name.
      schema: {type: string}
  responses:
    Unauthorized:
      description: Not signed in (`not signed in`), or the session ended (`session expired`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    Forbidden:
      description: |
        The session may not do this. `code` tells which kind: `csrf` (a write
        without the right `X-CSRF-Token`), `waiting` (an account on no team),
        `password_change_required`; with no `code` the repository role is too
        low. (An admin-only route answers a user 404, not 403.)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    NotFound:
      description: |
        No such thing, or one the session cannot see: both are answered the
        same.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    BadRequest:
      description: The request is wrong. `error` says how, in words for the user.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    Conflict:
      description: The request conflicts with the current state (taken, in use, managed by the config, stale, not open). `error` says which.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    InternalError:
      description: A failure on the server. The message says nothing of the cause.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    BadGateway:
      description: The platform (GitLab or GitHub) could not be asked, or its answer could not be used.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    PlainTextError:
      description: A short plain-text message.
      content:
        text/plain:
          schema: {type: string}
  schemas:
    # ------------------------------------------------------------- shared shapes
    ErrorBody:
      type: object
      description: 'The body of every JSON error: `{"error": "message"}`, with a `code` for a few.'
      required: [error]
      properties:
        error: {type: string}
        code:
          type: string
          description: Present on some 403s, and on the 401 of `GET /api/me` for a JWT whose email is not allowed.
          enum: [csrf, waiting, password_change_required, not_allowed]
    StatusBody:
      type: object
      description: A short word for what happened. The operation lists the values.
      required: [status]
      properties:
        status: {type: string}
    CSRFTokenBody:
      type: object
      required: [csrfToken]
      properties:
        csrfToken: {type: string}
    Outcome:
      type: string
      description: |
        `running` (queued, being reviewed, or not posted yet), `approved` (the
        approve bot approved this run), `blocking` (a skill found blocking
        issues), `draft` (clean, not approved because the change was a draft),
        `no_blocking` (clean but not approved, for the reason given), `failed`
        (no usable review), `superseded` (replaced by a newer push, or the
        change was closed), `skipped` (the repository has no skills; never a
        review or a failure), `unknown` (published before outcomes were
        recorded), `waiting` (the repository doesn't trust the change's
        author; held until someone with write access starts the review).
      enum: [running, approved, blocking, draft, no_blocking, failed, superseded, skipped, unknown, waiting]
    # ----------------------------------------------------------- request bodies
    PasswordSignInRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password:
          type: string
          format: password
    PasswordChangeRequest:
      type: object
      required: [current, new]
      properties:
        current:
          type: string
          format: password
        new:
          type: string
          format: password
          minLength: 12
          description: At least 12 characters, and different from the current one.
    SwitchOnRequest:
      type: object
      required: [instance, project]
      properties:
        instance:
          type: string
          description: The instance the repository is on.
        project:
          type: string
          maxLength: 1024
    RerunRequest:
      type: object
      properties:
        failed:
          type: boolean
          description: Re-run only the skills that failed.
          default: false
    DismissRequest:
      type: object
      required: [fingerprint]
      properties:
        fingerprint: {type: string}
        reason:
          type: string
          description: Needed for a blocking finding. Up to 500 characters.
    RestoreRequest:
      type: object
      required: [fingerprint]
      properties:
        fingerprint: {type: string}
    StopUsingRequest:
      type: object
      required: [fingerprint]
      properties:
        fingerprint: {type: string}
    CreateAccountRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9._-]{1,64}$'
    AddUserRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Exactly one address; lower-cased with ASCII rules.
        teams:
          type: array
          description: Teams to put the account on, each once.
          items:
            type: object
            required: [teamId]
            properties:
              teamId:
                type: integer
                format: int64
              role:
                type: string
                enum: [viewer, maintainer]
                description: Defaults to `viewer`.
    PutRepositoryTeamsRequest:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          description: The IDs of the teams that list the repository themselves. `[]` takes it off every team that lists it.
          items:
            type: integer
            format: int64
    SetAccountRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, user]
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    UpdateTeamRequest:
      type: object
      required: [name, members, repos]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        members:
          type: array
          description: SSO accounts with their role on this team. An account named twice has the higher role.
          items:
            type: object
            required: [accountId, role]
            properties:
              accountId:
                type: integer
                format: int64
              role:
                type: string
                enum: [viewer, maintainer]
        repos:
          type: array
          description: An empty `project` covers every repository of the instance, now and later.
          items: {$ref: '#/components/schemas/TeamRepoView'}
    CreateInstanceRequest:
      type: object
      required: [name, platform]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9-]+$'
          maxLength: 63
        platform:
          type: string
          enum: [gitlab, github]
        url:
          type: string
          description: GitLab only. The https address of the server, without a trailing slash.
        apiURL:
          type: string
          description: GitHub only. The https address of the API, without a trailing slash.
        reviewAppID:
          type: integer
          format: int64
          description: GitHub only. Positive.
        approveAppID:
          type: integer
          format: int64
          description: GitHub only. 0 approves with a bot user's token, the `reviewAppID` with the review App, another App ID with an approve App.
        approveWithReviewBot:
          type: boolean
          description: GitLab only. The review bot's own user approves too, with no `approve_token`. It cannot change after the instance is added.
        secrets:
          type: object
          description: |
            Secret values by field. GitLab: `review_token`, and `approve_token`
            unless `approveWithReviewBot` is set (`webhook_secret` is
            generated: do not send it). GitHub:
            `review_app_key`, `approve_app_key` or `approve_token` by the
            approver, `webhook_secret`. Each at most 16 KiB. Write-only.
          additionalProperties:
            type: string
            format: password
    UpdateInstanceRequest:
      type: object
      description: |
        `secrets` is needed. The address and App IDs cannot change; they are
        accepted only with their current value.
      properties:
        secrets:
          type: object
          additionalProperties:
            type: string
            format: password
        url:
          type: [string, 'null']
        apiURL:
          type: [string, 'null']
        reviewAppID:
          type: [integer, 'null']
          format: int64
        approveAppID:
          type: [integer, 'null']
          format: int64
    PutLLMRequest:
      type: object
      required: [provider, model]
      properties:
        provider:
          type: string
          maxLength: 256
        model:
          type: string
          maxLength: 256
        baseURL:
          type: string
          description: Empty, or an absolute http or https URL without credentials (at most 2048 characters).
        apiKey:
          type: [string, 'null']
          format: password
          description: Needed only when none is stored. At most 16 KiB. Never returned.
    CreateSkillRequest:
      type: object
      required: [name, content]
      properties:
        name: {type: string}
        content:
          type: string
          description: The skill's markdown, with its frontmatter.
        addToDefaults:
          type: boolean
          default: false
    UpdateSkillRequest:
      type: object
      required: [content, version]
      properties:
        content: {type: string}
        version:
          type: integer
          minimum: 1
          description: The version that was opened.
    CopySkillRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The new name.
    StartSkillFetchRequest:
      type: object
      description: A repository of an instance (`instance` and `repo`), or a public `url`, not both.
      required: [ref]
      properties:
        instance: {type: string}
        repo: {type: string}
        url: {type: string}
        ref:
          type: string
          description: A branch or tag.
        path:
          type: string
          description: The folder in the repository. Empty for the root.
        purpose:
          type: string
          enum: [install, update]
          default: install
        fromRef:
          type: string
          description: For an update, the ref the installed skills came from (default `ref`).
    InstallSkillsRequest:
      type: object
      required: [names]
      properties:
        names:
          type: array
          minItems: 1
          maxItems: 200
          items: {type: string}
        addToDefaults:
          type: boolean
          default: false
    UpdateSkillsRequest:
      type: object
      required: [names]
      properties:
        names:
          type: array
          minItems: 1
          maxItems: 200
          items: {type: string}
    RepositorySettingsRequest:
      type: object
      description: |
        Some of the settings; the others stay. A null resets one to its
        default. At most 64 KiB. Any other key is 400.
      additionalProperties: false
      properties:
        approve:
          type: [boolean, 'null']
        reviewDrafts:
          type: [boolean, 'null']
        inlineFindings:
          type: [boolean, 'null']
        commandsAuthorAndMaintainersOnly:
          type: [boolean, 'null']
        incrementalReviews:
          type: [boolean, 'null']
        learnFromDismissals:
          type: [boolean, 'null']
        quietReviews:
          type: [boolean, 'null']
        linkedReposEnabled:
          type: [boolean, 'null']
          description: Admins only (403 for a maintainer). Null follows the default (off).
        linkedRepos:
          type: [array, 'null']
          description: |
            Admins only (403 for a maintainer). The repository's links: null
            or `[]` clears them. At most 3, each a plain `owner/name` other
            than the repository itself and not repeated, with at most 50
            watched globs of at most 200 characters each. `canBlock` left out
            is true. GitHub repositories only, and every target must be as
            open as the repository or more, and in the same installation of
            the review App: the platform is asked on every save. A rule that
            fails is 400 with the reason, a platform that cannot tell is 502,
            and nothing is saved.
          maxItems: 3
          items: {$ref: '#/components/schemas/LinkView'}
        commentLayout:
          type: [array, 'null']
          description: |
            The comment's blocks in order, each `block:state`: the blocks are
            `summary`, `findings`, `dismissed`, `checks` and `files`, the
            states `open` and `collapsed`. A block left out is hidden.
            `findings` is required and each block is named once. Null follows
            the default (the admin default, else the built-in layout). An
            empty list, an unknown block or state, a repeated block and a list
            without `findings` are 400.
          minItems: 1
          items: {type: string, pattern: '^(summary|findings|dismissed|checks|files):(open|collapsed)$'}
        failureStatus:
          type: [string, 'null']
          enum: [failed, neutral, null]
        skills:
          type: [array, 'null']
          description: A non-empty list of library skill names, or null for the default list.
          minItems: 1
          items: {type: string}
        repoSkills:
          type: [array, 'null']
          description: The names of detected repository skills to turn on. Empty or null for none.
          items: {type: string}
        jobTimeoutSeconds:
          type: [integer, 'null']
          minimum: 60
          maximum: 7200
        maxTurns:
          type: [integer, 'null']
          minimum: 5
          maximum: 200
        jobMemory:
          type: [string, 'null']
          description: A Kubernetes quantity such as `6Gi`, from 256Mi (or the Job's memory request, when higher) to 32Gi.
        rerunLimitPerMR:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
          description: Admins of the repository only.
        rerunLimitPerRepo:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
          description: Admins of the repository only.
        trustedAuthorsOnly:
          type: [string, 'null']
          enum: ['on', 'off', null]
          description: Whether only trusted authors are reviewed without someone starting it. Null follows the instance.
        trustedAuthors:
          type: [array, 'null']
          maxItems: 100
          description: The repository's allowlist. An entry without `id` is looked up by username when it is saved (400 when the platform doesn't know it), then stored by ID.
          items: {$ref: '#/components/schemas/TrustedAuthorInput'}
    StartRequest:
      type: object
      required: [head]
      additionalProperties: false
      properties:
        head:
          type: string
          pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'
    InstanceTrustRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [follow_visibility, 'on', 'off']
    TrustedAuthor:
      description: A user on a repository's allowlist, matched by ID; username is the name it had when added.
      type: object
      required: [id, username]
      properties:
        id: {type: integer}
        username: {type: string}
    TrustedAuthorInput:
      type: object
      required: [username]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 0
          description: The platform's user ID; left out for a username to look up.
        username: {type: string}
    WaitingView:
      description: A change whose review waits for someone with write access to start it.
      type: object
      required: [number, head, title, author, webUrl, since, reason]
      properties:
        number: {type: integer}
        head:
          type: string
          description: The commit that waits. Start review sends it back.
        title: {type: string}
        author: {type: string}
        webUrl: {type: string}
        since: {type: string, format: date-time}
        reason:
          type: string
          enum: [untrusted_author, trust_check_failed]
    DefaultsRequest:
      type: object
      description: |
        The defaults for repositories switched on in the dashboard. Same keys
        and bounds as `RepositorySettingsRequest`, except `repoSkills`, and
        `skills` is the default list. Replaces them all: a missing key or null
        is the built-in default (for `skills`, a missing key keeps the list).
      additionalProperties: false
      properties:
        approve:
          type: [boolean, 'null']
        reviewDrafts:
          type: [boolean, 'null']
        inlineFindings:
          type: [boolean, 'null']
        commandsAuthorAndMaintainersOnly:
          type: [boolean, 'null']
        incrementalReviews:
          type: [boolean, 'null']
        learnFromDismissals:
          type: [boolean, 'null']
        quietReviews:
          type: [boolean, 'null']
        linkedReposEnabled:
          type: [boolean, 'null']
        commentLayout:
          type: [array, 'null']
          description: |
            The comment's blocks in order, each `block:state`: the blocks are
            `summary`, `findings`, `dismissed`, `checks` and `files`, the
            states `open` and `collapsed`. A block left out is hidden.
            `findings` is required and each block is named once. Null is the
            built-in layout. An empty list, an unknown block or state, a
            repeated block and a list without `findings` are 400.
          minItems: 1
          items: {type: string, pattern: '^(summary|findings|dismissed|checks|files):(open|collapsed)$'}
        failureStatus:
          type: [string, 'null']
          enum: [failed, neutral, null]
        skills:
          type: [array, 'null']
          description: Library skill names. Null or empty clears the list.
          items: {type: string}
        jobTimeoutSeconds:
          type: [integer, 'null']
          minimum: 60
          maximum: 7200
        maxTurns:
          type: [integer, 'null']
          minimum: 5
          maximum: 200
        jobMemory:
          type: [string, 'null']
        rerunLimitPerMR:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
        rerunLimitPerRepo:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
    ScanStartedBody:
      type: object
      required: [scan]
      properties:
        scan: {$ref: '#/components/schemas/ScanView'}
    ScanBusyBody:
      type: object
      required: [error, scan]
      properties:
        error: {type: string}
        scan: {$ref: '#/components/schemas/ScanView'}
    ScanTooSoonBody:
      type: object
      required: [error, waitSeconds]
      properties:
        error: {type: string}
        waitSeconds: {type: integer}
    # ---------------------------------------------- schemas named after Go types
    # The dashboard's view types are in internal/dashboard (view.go,
    # dashboard.go); `readiness.`, `result.`, `skillfetch.` and `store.` are
    # packages under internal/. internal/dashboard/openapi_test.go compares
    # each with its type's json tags.
    AdminSettingsView:
      description: The defaults a repository switched on in the dashboard gets, and the model. Never a key.
      type: object
      required: [defaults, llm]
      properties:
        defaults: {$ref: '#/components/schemas/DefaultsView'}
        llm: {$ref: '#/components/schemas/LLMView'}
    AttentionView:
      description: One setup problem.
      type: object
      required: [instance, project, kind, message, updatedAt]
      properties:
        instance: {type: string}
        project:
          type: string
          description: '"" for a problem of the whole instance.'
        kind: {type: string}
        message: {type: string}
        updatedAt:
          type: string
          format: date-time
    AuditPageView:
      description: A page of the audit log.
      type: object
      required: [entries, next]
      properties:
        entries:
          type: array
          items: {$ref: '#/components/schemas/AuditView'}
        next:
          type: integer
          description: The `before` of the page after; 0 when the log has nothing older.
    AuditView:
      description: One audit entry.
      type: object
      required: [id, at, actor, action, instance, project, detail]
      properties:
        id: {type: integer}
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: 'The full email of an SSO account, "root (password)" for a local admin, "cli" for
            a password reset from the command line. Older entries of platform accounts read "alice (gitlab main)".'
        action: {type: string}
        instance:
          type: string
          description: '"" when it is not about a repository.'
        project:
          type: string
          description: '"" when it is not about a repository.'
        detail:
          type: string
          description: Never holds a secret.
    AvailableRepo:
      description: One repository that can be switched on.
      type: object
      required: [instance, project, platform]
      properties:
        instance: {type: string}
        project: {type: string}
        platform:
          type: string
          enum: [gitlab, github]
    AvailableView:
      description: One page of the repositories that can be switched on, 50 at most.
      type: object
      required: [items, page, hasMore, truncated]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/AvailableRepo'}
        page:
          type: integer
          minimum: 1
          description: The page asked for.
        hasMore:
          type: boolean
          description: True when a later page may hold more.
        truncated:
          type: boolean
          description: True when the list the page is made from was too long or too slow to read whole (GitHub only; a GitLab page is never truncated).
    LinkView:
      description: One link of a repository to another, for the impact check.
      type: object
      required: [target, watched, canBlock]
      properties:
        target:
          type: string
          description: The linked repository, `owner/name`.
        watched:
          type: array
          items: {type: string}
          description: Globs of changed files that make the check run. None means every change.
        canBlock:
          type: boolean
          description: Whether a finding on this link may block. Off makes every finding of it a suggestion.
    LinkableView:
      description: Repositories the instance's review App reaches, each with whether the repository may link it. 200 at most, by name.
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LinkableRepo'}
        truncated:
          type: boolean
          description: True when there were more repositories than are listed.
    LinkableRepo:
      type: object
      required: [repo, visibility, checked, linkable, reason]
      properties:
        repo: {type: string}
        visibility:
          type: string
          enum: ['', public, internal, private]
          description: Who may read it, when it was read; otherwise "".
        checked:
          type: boolean
          description: |
            Whether the rules were applied to it. One that was not (the reads
            ran out of time, or one failed) is `linkable` with a `reason` that
            says it is checked when the links are saved: the save is what
            enforces the rules.
        linkable: {type: boolean}
        reason:
          type: string
          description: Why it cannot be linked, in plain words; "" when it can.
    CanView:
      description: What the session may do to the review with the buttons. A hint for the page; the routes
        check again.
      type: object
      required: [rerun, dismissBlocking, dismissSuggestion, restore]
      properties:
        rerun:
          type: boolean
          description: Start the review again, whole or only its failed skills.
        dismissBlocking:
          type: boolean
          description: Not the change's author.
        dismissSuggestion: {type: boolean}
        restore: {type: boolean}
    CheckView:
      description: One check of a skill's checklist.
      type: object
      required: [batch, section, name, status, detail]
      properties:
        batch: {type: integer}
        section: {type: string}
        name: {type: string}
        status:
          type: string
          enum: [pass, fail, n/a]
        detail: {type: string}
    DefaultValues:
      description: DefaultsView's settings without the skill list, with the same keys.
      type: object
      required: [approve, reviewDrafts, inlineFindings, commandsAuthorAndMaintainersOnly, incrementalReviews, learnFromDismissals, quietReviews, linkedReposEnabled, commentLayout, failureStatus, jobTimeoutSeconds, maxTurns, jobMemory, rerunLimitPerMR, rerunLimitPerRepo]
      properties:
        approve: {type: boolean}
        reviewDrafts: {type: boolean}
        inlineFindings: {type: boolean}
        commandsAuthorAndMaintainersOnly: {type: boolean}
        incrementalReviews: {type: boolean}
        learnFromDismissals: {type: boolean}
        quietReviews: {type: boolean}
        linkedReposEnabled: {type: boolean}
        commentLayout:
          type: array
          items: {type: string}
          description: The comment's blocks as `block:state` entries in order; always the built-in layout, because the config has no layout.
        failureStatus: {type: string}
        jobTimeoutSeconds: {type: integer}
        maxTurns: {type: integer}
        jobMemory: {type: string}
        rerunLimitPerMR: {type: integer}
        rerunLimitPerRepo: {type: integer}
    DefaultsView:
      description: The settings a repository gets when it sets none.
      type: object
      required: [approve, reviewDrafts, inlineFindings, commandsAuthorAndMaintainersOnly, incrementalReviews, learnFromDismissals, quietReviews, linkedReposEnabled, commentLayout, failureStatus, jobTimeoutSeconds, maxTurns, jobMemory, rerunLimitPerMR, rerunLimitPerRepo, skills, config, pinned]
      properties:
        approve: {type: boolean}
        reviewDrafts: {type: boolean}
        inlineFindings: {type: boolean}
        commandsAuthorAndMaintainersOnly: {type: boolean}
        incrementalReviews: {type: boolean}
        learnFromDismissals: {type: boolean}
        quietReviews: {type: boolean}
        linkedReposEnabled: {type: boolean}
        commentLayout:
          type: array
          items: {type: string}
          description: The comment's blocks as `block:state` entries in order; the built-in layout until one is saved.
        failureStatus: {type: string}
        jobTimeoutSeconds: {type: integer}
        maxTurns: {type: integer}
        jobMemory:
          type: string
          description: The Job's memory limit, "" when none.
        rerunLimitPerMR: {type: integer}
        rerunLimitPerRepo: {type: integer}
        skills:
          type: array
          items: {type: string}
          description: The default list of library skills.
        config:
          $ref: '#/components/schemas/DefaultValues'
          description: The values the config gives, before anything saved here.
        pinned:
          type: object
          additionalProperties: {type: boolean}
          description: Which defaults were saved here and so no longer follow the config, by JSON key. Every
            key is present.
    DetectedSkillView:
      description: A skill found in a repository folder that runs only when turned on.
      type: object
      required: [name, folder, 'on']
      properties:
        name: {type: string}
        folder: {type: string}
        problem: {type: string}
        'on':
          type: boolean
          description: Whether the repository turned it on.
    DismissedView:
      description: A dismissal of a finding.
      type: object
      required: [by, reason, at]
      properties:
        by:
          type: string
          description: Who dismissed it, as the audit log names them.
        reason: {type: string}
        at:
          type: string
          format: date-time
    FetchedSkillView:
      description: One skill a read found.
      type: object
      required: [name, path, size, taken]
      properties:
        name: {type: string}
        path: {type: string}
        size:
          type: integer
          description: 'The bytes of its text (0 when the text was not kept: too large, or holding a secret).'
        problem:
          type: string
          description: Why it cannot be installed.
        taken:
          type: boolean
          description: A skill of that name is in the library already.
    FilesView:
      description: The files of every skill together, each path once.
      type: object
      required: [reviewed, skipped, notReviewed]
      properties:
        reviewed:
          type: array
          items: {type: string}
        skipped:
          type: array
          items: {$ref: '#/components/schemas/SkippedFile'}
        notReviewed:
          type: array
          items: {$ref: '#/components/schemas/NotReviewedFile'}
    FindingView:
      description: One finding.
      type: object
      required: [id, fingerprint, severity, title, file, explanation, suggestedFix, dismissed]
      properties:
        id: {type: string}
        fingerprint:
          type: string
          description: 'Identifies the finding across runs: what a dismissal and a restore name.'
        severity:
          type: string
          enum: [blocking, suggestion]
        title: {type: string}
        file: {type: string}
        line:
          type: integer
          description: Left out when the finding has none.
        explanation: {type: string}
        suggestedFix: {type: string}
        dismissed:
          oneOf:
          - $ref: '#/components/schemas/DismissedView'
          - type: 'null'
          description: Who set the finding aside, and why; null for a finding that stands.
    InputSkill:
      description: One skill of the final set.
      type: object
      required: [name, source, folder, version, content, url]
      properties:
        name: {type: string}
        source:
          type: string
          description: '"library" or the repository folder the skill was read from; "" with a problem.'
        folder:
          type: string
          description: The repository folder, "" for a library skill.
        version:
          type: integer
          description: The library skill's version, 0 for a repository skill.
        content: {type: string}
        url:
          type: string
          description: Where a repository skill is on the platform; "" for a library skill or when the web
            address is not known.
        problem:
          type: string
          description: Why a review would fail on this skill; content is then empty.
    InputsView:
      description: The skills and instructions a review would get, read from the default branch.
      type: object
      required: [branch, skills, detected, instructions]
      properties:
        branch: {type: string}
        skills:
          type: array
          items: {$ref: '#/components/schemas/InputSkill'}
          description: The skills a review would run, and each skill a review would fail on, with its problem.
        detected:
          type: array
          items: {$ref: '#/components/schemas/DetectedSkillView'}
          description: The skills of the repository folders that run only when turned on.
        instructions: {type: string}
    InstanceAdminView:
      description: One instance.
      type: object
      required: [name, trustedAuthorsOnly, platform, source, removing, url, apiURL, reviewAppID, approveAppID, webhookURL, approver, secrets]
      properties:
        name: {type: string}
        trustedAuthorsOnly:
          type: string
          enum: [follow_visibility, 'on', 'off']
          description: The default of the instance's repositories.
        platform:
          type: string
          enum: [gitlab, github]
        source:
          type: string
          enum: [config, dashboard]
        removing:
          type: boolean
          description: Set while the instance is being taken out.
        url:
          type: string
          description: A GitLab instance's address.
        apiURL:
          type: string
          description: A GitHub instance's API address.
        reviewAppID: {type: integer}
        approveAppID: {type: integer}
        webhookURL:
          type: string
          description: Where the platform sends this instance's webhooks.
        approver:
          type: string
          enum: [app, review_app, review_bot, token]
          description: '"app", "review_app", "review_bot" or "token".'
        secrets:
          type: object
          additionalProperties: {$ref: '#/components/schemas/SecretView'}
          description: 'By field. The fields an instance takes: review_token, approve_token (not when the review bot approves) and webhook_secret
            (GitLab); review_app_key, approve_app_key or approve_token, and webhook_secret (GitHub).'
    SignInAdminView:
      description: The sign-in settings in force. The client secret is never sent.
      type: object
      required: [source, editable, mode, label, issuer, clientID, clientSecret, header, audience, jwksURL, emailClaim, allowedDomains, allowedEmails, callbackURL]
      properties:
        source:
          type: string
          enum: [config, dashboard]
        editable:
          type: boolean
          description: False when the config file sets the sign-in.
        mode:
          type: string
          enum: ['', oidc, jwt]
          description: Empty means only local admins sign in.
        label:
          type: string
          description: 'The name on the button, "Sign in with <label>"; "SSO" when empty.'
        issuer: {type: string}
        clientID: {type: string}
        clientSecret:
          $ref: '#/components/schemas/SecretView'
          description: Whether a secret is set. `updatedAt` is always null.
        header: {type: string}
        audience: {type: string}
        jwksURL: {type: string}
        emailClaim: {type: string}
        allowedDomains:
          type: array
          items: {type: string}
        allowedEmails:
          type: array
          items: {type: string}
        callbackURL:
          type: string
          description: dashboard.url and /auth/oidc/callback, the redirect URI to register.
    SignInTestView:
      description: Whether the provider's discovery document or key set could be read.
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
    ssoView:
      description: The sign-in page's OIDC button.
      type: object
      required: [label]
      properties:
        label: {type: string}
    PutSignInRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: ['', oidc, jwt]
        label: {type: string, maxLength: 64}
        issuer:
          type: string
          description: An https URL.
        clientID: {type: string}
        clientSecret:
          type: [string, 'null']
          description: Absent or null keeps the stored secret, "" removes it, anything else replaces it (at most 16 KiB).
        header: {type: string}
        audience: {type: string}
        jwksURL:
          type: string
          description: An https URL.
        emailClaim:
          type: string
          description: '"email" when empty in jwt mode.'
        allowedDomains:
          type: array
          items: {type: string}
        allowedEmails:
          type: array
          items: {type: string}
    TestSignInRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [oidc, jwt]
        issuer: {type: string}
        jwksURL: {type: string}
    LLMAdminView:
      description: Where the model comes from ("config" or "dashboard"), the model, and whether a key is set.
      type: object
      required: [source, provider, model, baseURL, key, editable]
      properties:
        source:
          type: string
          enum: [config, dashboard]
        provider: {type: string}
        model: {type: string}
        baseURL: {type: string}
        key: {$ref: '#/components/schemas/SecretView'}
        editable:
          type: boolean
          description: 'True for an admin when the config has no llm: block.'
    LLMView:
      description: The model reviews use.
      type: object
      required: [provider, model]
      properties:
        provider: {type: string}
        model: {type: string}
    Last7View:
      description: The repository's runs of the last 7 days.
      type: object
      required: [reviews, approved, failed]
      properties:
        reviews: {type: integer}
        approved: {type: integer}
        failed: {type: integer}
    LibrarySkillView:
      description: One skill of the library, without its text.
      type: object
      required: [name, version, size, updatedAt, inDefaults, source]
      properties:
        name: {type: string}
        updatedBy:
          type: string
          description: Shown to admins only.
        version: {type: integer}
        size: {type: integer}
        updatedAt:
          type: string
          format: date-time
        inDefaults: {type: boolean}
        source:
          oneOf:
          - $ref: '#/components/schemas/SkillSourceView'
          - type: 'null'
    LogView:
      description: The redacted tail of the review Job's log.
      type: object
      required: [text]
      properties:
        text: {type: string}
    NewAccountView:
      description: A local admin just made, with its generated password. The only time the password is
        shown.
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}
    NotReviewedFile:
      description: A file whose batch failed, and why.
      type: object
      required: [path, cause]
      properties:
        path: {type: string}
        cause: {type: string}
    OverviewView:
      description: Body of GET /api/overview.
      type: object
      required: [stats, recent, attention, setup]
      properties:
        stats: {$ref: '#/components/schemas/StatsView'}
        recent:
          type: array
          items: {$ref: '#/components/schemas/ReviewSummary'}
        attention:
          type: array
          items: {$ref: '#/components/schemas/AttentionView'}
        setup:
          oneOf:
          - $ref: '#/components/schemas/SetupView'
          - type: 'null'
          description: The setup checklist, for admins only; null once all four items are done and for everyone
            else.
    PastDismissalView:
      description: A finding whose dismissals teach the repository's reviews. By, at and number are of the
        dismissal shown.
      type: object
      required: [skill, severity, file, title, reason, by, at, number, fingerprint]
      properties:
        skill: {type: string}
        severity:
          type: string
          enum: [blocking, suggestion]
        file: {type: string}
        title: {type: string}
        reason: {type: string}
        by: {type: string}
        at:
          type: string
          format: date-time
        number: {type: integer}
        fingerprint: {type: string}
    ReadinessView:
      description: The Readiness tab.
      type: object
      required: [latest, active, checklist, canScan, configRepo, followsDefaults, applyBase]
      properties:
        latest:
          oneOf:
          - $ref: '#/components/schemas/ScanView'
          - type: 'null'
          description: The latest finished scan (done or failed); null when there is none.
        active:
          oneOf:
          - $ref: '#/components/schemas/ScanView'
          - type: 'null'
          description: The queued or running scan; null when there is none.
        checklist:
          oneOf:
          - $ref: '#/components/schemas/readiness.Checklist'
          - type: 'null'
          description: Built now from the latest finished scan; null until a scan has finished.
        canScan:
          type: boolean
          description: The session is a maintainer or admin of the repository.
        configRepo:
          type: boolean
          description: The config file sets the repository up, so its skills are changed there.
        followsDefaults:
          type: boolean
          description: 'The repository''s skills are null: it follows the default list.'
        applyBase:
          type: array
          items: {type: string}
          description: 'Today''s list of library skills: the repository''s, or the default list.'
    RepositoryDetailView:
      description: A repository with its effective settings.
      type: object
      required: [repo, settings, attention, role, waiting, instanceTrustedAuthorsOnly]
      properties:
        repo: {$ref: '#/components/schemas/RepositoryView'}
        settings:
          type: object
          additionalProperties: {$ref: '#/components/schemas/SettingView'}
          description: Keyed approve, reviewDrafts, inlineFindings, commandsAuthorAndMaintainersOnly, incrementalReviews,
            learnFromDismissals, quietReviews, commentLayout, linkedReposEnabled, linkedRepos, failureStatus, skills, repoSkills, jobTimeoutSeconds, maxTurns, jobMemory,
            rerunLimitPerMR, rerunLimitPerRepo, trustedAuthorsOnly (the mode in
            effect, follow_visibility, on or off) and trustedAuthors (a list of TrustedAuthor).
        attention:
          type: array
          items: {$ref: '#/components/schemas/AttentionView'}
        role:
          type: string
          enum: [admin, maintainer, viewer]
          description: The session's role on the repository.
        waiting:
          type: array
          items: {$ref: '#/components/schemas/WaitingView'}
          description: The changes waiting for someone to start their review, newest first.
        instanceTrustedAuthorsOnly:
          type: string
          enum: [follow_visibility, 'on', 'off']
          description: The instance's trusted-authors mode, which the repository follows unless it sets its own.
    RepositoryView:
      description: One repository switched on.
      type: object
      required: [instance, project, platform, source, 'on', last7, health]
      properties:
        instance: {type: string}
        project: {type: string}
        platform:
          type: string
          enum: [gitlab, github]
        source:
          type: string
          enum: [config, dashboard]
          description: '"config" (read-only here) or "dashboard".'
        'on': {type: boolean}
        last7: {$ref: '#/components/schemas/Last7View'}
        health:
          type: string
          enum: [ok, attention]
          description: '"attention" when it has setup problems, else "ok".'
    ReviewDetailView:
      description: The change and every run of it, newest first.
      type: object
      required: [header, runs, role, can]
      properties:
        header: {$ref: '#/components/schemas/ReviewHeader'}
        runs:
          type: array
          items: {$ref: '#/components/schemas/RunSummary'}
        role:
          type: string
          enum: [viewer, maintainer, admin, '']
          description: The session's role on the repository ("" for a repository switched off).
        can: {$ref: '#/components/schemas/CanView'}
    ReviewHeader:
      description: The change as pergent.sh last read it.
      type: object
      required: [instance, project, platform, number, title, sourceBranch, targetBranch, webURL]
      properties:
        instance: {type: string}
        project: {type: string}
        platform:
          type: string
          enum: [gitlab, github]
        number: {type: integer}
        title: {type: string}
        sourceBranch: {type: string}
        targetBranch: {type: string}
        author:
          type: string
          description: The username who opened it; left out when unknown.
        webURL: {type: string}
    ReviewListView:
      description: One page of reviews.
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReviewSummary'}
        nextCursor:
          type: string
          description: 'Not "" when there is a next page: pass it as cursor.'
    ReviewSummary:
      description: One merge request or pull request, as its newest run left it.
      type: object
      required: [instance, project, platform, number, title, outcome, reason, updatedAt, webURL]
      properties:
        instance: {type: string}
        project: {type: string}
        platform:
          type: string
          enum: [gitlab, github]
        number:
          type: integer
          description: The MR's IID or the PR's number.
        title: {type: string}
        outcome: {$ref: '#/components/schemas/Outcome'}
        reason:
          type: string
          description: Why, in a sentence ("" for approved).
        updatedAt:
          type: string
          format: date-time
        webURL:
          type: string
          description: The change's page on the platform; "" when unknown.
    RunDetailView:
      description: One run. A run without a usable result has no skills or files.
      type: object
      required: [run, instance, project, number, status, approved, approvalReason, pergentVersion, model, maxTurns, quiet, incrementalNote, tokens, files, skills, latestDecided]
      properties:
        run: {$ref: '#/components/schemas/RunSummary'}
        instance: {type: string}
        project: {type: string}
        number: {type: integer}
        status:
          type: string
          enum: [running, success, failed, neutral, canceled, '']
          description: The status pergent.sh set on the commit, or "" when none.
        approved:
          type: boolean
          description: The approve bot approved this run.
        approvalReason:
          type: string
          description: Why it is not approved; "" when it is.
        pergentVersion: {type: string}
        model:
          type: [string, 'null']
          description: The model the review ran with; null for a run that did not record it.
        maxTurns:
          type: [integer, 'null']
          description: The step limit each opencode run had; null when not recorded.
        quiet:
          type: boolean
          description: The review was started quiet; false for a run that did not record it.
        incrementalNote:
          type: string
          description: What an incremental review covered; "" for a full review.
        tokens: {$ref: '#/components/schemas/TokensView'}
        files: {$ref: '#/components/schemas/FilesView'}
        skills:
          type: array
          items: {$ref: '#/components/schemas/SkillView'}
        latestDecided:
          type: boolean
          description: True for the one run of the change that dismiss and restore act on.
    RunSummary:
      description: One run in a review's history.
      type: object
      required: [id, head, trigger, outcome, reason, createdAt, durationSeconds]
      properties:
        id: {type: string}
        head: {type: string}
        trigger:
          type: string
          enum: [first, push, retarget, rerun]
          description: What started it, read from the history.
        outcome: {$ref: '#/components/schemas/Outcome'}
        reason: {type: string}
        createdAt:
          type: string
          format: date-time
        durationSeconds:
          type: [number, 'null']
          description: From the Job's start to its result; null while it runs or when it never started.
    ScanView:
      description: One readiness scan.
      type: object
      required: [id, state, startedBy, branch, commit, error, queuedAt, finishedAt]
      properties:
        id: {type: string}
        state:
          type: string
          enum: [queued, running, done, failed]
        startedBy:
          type: string
          description: Who asked ("alice (gitlab main)"), "switch-on" or "upgrade".
        branch:
          type: string
          description: '"" until the scan read it.'
        commit:
          type: string
          description: '"" until the scan read it.'
        error:
          type: string
          description: Why a failed scan could not scan the files.
        queuedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
          description: Null until it ends.
    SecretView:
      description: Whether a secret is set and when it last changed. The value is never sent.
      type: object
      required: [set, updatedAt]
      properties:
        set: {type: boolean}
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: Null for a secret that comes from the config's environment.
    SettingView:
      description: A setting's effective value and whether the repository sets it (otherwise it is the default).
      type: object
      required: [value, overridden]
      properties:
        value:
          description: 'Its type depends on the setting: boolean, string, integer, a list of names, or null
            (skills: the default list).'
        overridden: {type: boolean}
    SetupView:
      description: 'What an admin still has to set up, one item each: an LLM with its key, a connected instance,
        a skill in the library and a repository switched on.'
      type: object
      required: [llm, instance, skill, repository]
      properties:
        llm: {type: boolean}
        instance: {type: boolean}
        skill: {type: boolean}
        repository: {type: boolean}
    SkillDetailView:
      description: A skill with its text (shown as plain text only) and its versions, newest first.
      allOf:
      - $ref: '#/components/schemas/LibrarySkillView'
      - type: object
        required: [content, versions]
        properties:
          content: {type: string}
          versions:
            type: array
            items: {$ref: '#/components/schemas/SkillVersionView'}
    SkillFetchResultView:
      description: The answer for one name of an install or an update.
      type: object
      required: [name, ok]
      properties:
        name: {type: string}
        ok: {type: boolean}
        error: {type: string}
    SkillFetchStartedView:
      description: The read to ask about.
      type: object
      required: [id]
      properties:
        id: {type: string}
    SkillFetchView:
      description: A read of a skill source, for the admin who started it only.
      type: object
      required: [id, status, commit, error, purpose, ref, path, skills, updates]
      properties:
        id: {type: string}
        status:
          type: string
          enum: [running, done, failed]
          description: '"running", "done" or "failed".'
        commit:
          type: string
          description: The commit read.
        error:
          type: string
          description: Why it failed, for the admin.
        purpose:
          type: string
          enum: [install, update]
        instance: {type: string}
        repo: {type: string}
        url: {type: string}
        ref: {type: string}
        fromRef: {type: string}
        path: {type: string}
        skills:
          type: array
          items: {$ref: '#/components/schemas/FetchedSkillView'}
          description: The skills found, once done.
        updates:
          type: array
          items: {$ref: '#/components/schemas/SkillUpdateView'}
          description: 'For a done check for updates: each installed skill whose file is in the folder.'
    SkillInUseView:
      description: The 409 of a delete of a skill that is in use.
      type: object
      required: [error, repositories, inDefaults]
      properties:
        error: {type: string}
        repositories:
          type: array
          items: {$ref: '#/components/schemas/SkillUserRepoView'}
          description: The repositories that name it.
        inDefaults:
          type: boolean
          description: The default list names it.
    SkillResultView:
      description: What became of the findings of one skill at one severity decided in the window.
      type: object
      required: [skill, severity, raised, fixed, dismissed, open, wentAway, addressed, editedAt]
      properties:
        skill: {type: string}
        severity:
          type: string
          enum: [blocking, suggestion]
        raised: {type: integer}
        fixed: {type: integer}
        dismissed: {type: integer}
        open: {type: integer}
        wentAway: {type: integer}
        addressed:
          type: [integer, 'null']
          description: fixed * 100 / raised, a whole percent; null under 10 raised.
        editedAt:
          type: [string, 'null']
          format: date-time
          description: 'Set when the window holds more than one version of the skill: when the newest first
            appears.'
    SkillTokensView:
      description: The tokens one skill used on the changes the Skill results tab counts.
      type: object
      required: [skill, tokens]
      properties:
        skill: {type: string}
        tokens: {$ref: '#/components/schemas/TokensView'}
    SkillSourceView:
      description: Where an installed skill came from.
      type: object
      required: [kind, ref, commit]
      properties:
        kind:
          type: string
          enum: [instance, url]
          description: '"instance" (read through a connected instance) or "url" (a public git URL).'
        instance: {type: string}
        repo:
          type: string
          description: Shown to admins only; others get hidden.
        url: {type: string}
        path:
          type: string
          description: Sent with repo and url, never with hidden.
        ref: {type: string}
        commit: {type: string}
        hidden:
          type: boolean
          description: The repository is private to this user.
    SkillUpdateView:
      description: One installed skill in a check for updates.
      type: object
      required: [name, path, state, version, current, fetched]
      properties:
        name: {type: string}
        path: {type: string}
        state:
          type: string
          enum: [changed, same, removed at the source, renamed at the source]
          description: '"changed", "same", "removed at the source" or "renamed at the source".'
        problem:
          type: string
          description: Why it cannot be updated.
        version:
          type: integer
          description: Its library version now.
        current:
          type: string
          description: The text now, for a diff shown as plain text.
        fetched:
          type: string
          description: The text read.
    SkillUserRepoView:
      description: A repository that uses a skill.
      type: object
      required: [instance, project]
      properties:
        instance: {type: string}
        project: {type: string}
    SkillVersionDetailView:
      description: One version of a skill with its text.
      allOf:
      - $ref: '#/components/schemas/SkillVersionView'
      - type: object
        required: [content]
        properties:
          content: {type: string}
    SkillVersionView:
      description: One saved version of a skill.
      type: object
      required: [version, at, commit]
      properties:
        version: {type: integer}
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: Shown to admins only.
        commit: {type: string}
    SkillView:
      description: One skill's outcome.
      type: object
      required: [name, verdict, source, version, findings, dismissed, checks]
      properties:
        name: {type: string}
        verdict:
          type: string
          enum: [no_blocking_issues, has_blocking_issues, failed]
        source:
          type: [string, 'null']
          description: '"library", or the repository folder the skill was read from; "repo" for a run from
            before the folders; null when not recorded.'
        version:
          type: integer
          description: The library skill's version the review used; 0 for a repository skill and for a run
            that did not record it.
        findings:
          type: array
          items: {$ref: '#/components/schemas/FindingView'}
          description: Those still standing.
        dismissed:
          type: array
          items: {$ref: '#/components/schemas/FindingView'}
          description: Those set aside by a dismissal.
        checks:
          type: array
          items: {$ref: '#/components/schemas/CheckView'}
    SkillWrittenView:
      description: The version a create, an edit or a copy saved.
      type: object
      required: [version]
      properties:
        version: {type: integer}
    SkippedFile:
      description: A file no skill reviewed, and the rule that left it out.
      type: object
      required: [path, rule]
      properties:
        path: {type: string}
        rule: {type: string}
    StatsView:
      description: The runs started in the period that were not superseded, by outcome; approved counts the
        runs the approve bot approved.
      type: object
      required: [reviews, approved, blocking, failed]
      properties:
        reviews: {type: integer}
        approved: {type: integer}
        blocking: {type: integer}
        failed: {type: integer}
    TeamMemberView:
      description: 'A team''s member: an SSO account and its role on the team.'
      type: object
      required: [accountId, username, email, role]
      properties:
        accountId: {type: integer}
        username: {type: string}
        email: {type: string}
        role:
          type: string
          enum: [viewer, maintainer]
          description: '"viewer" or "maintainer".'
    TeamRef:
      description: Names a team.
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
    TeamRepoView:
      description: A repository a team covers.
      type: object
      required: [instance, project]
      properties:
        instance: {type: string}
        project: {type: string}
    TeamView:
      description: One team.
      type: object
      required: [id, name, members, repos]
      properties:
        id: {type: integer}
        name: {type: string}
        members:
          type: array
          items: {$ref: '#/components/schemas/TeamMemberView'}
        repos:
          type: array
          items: {$ref: '#/components/schemas/TeamRepoView'}
          description: The repositories it covers; a project "" covers every repository of the instance, now
            and later.
    TokensView:
      type: object
      required: [in, out]
      properties:
        in: {type: integer}
        out: {type: integer}
    UsageTokensView:
      description: >-
        Tokens used. `in` and `out` are what every total and ranking adds up;
        the rest are reported apart.
      type: object
      required: [in, out, cacheRead, cacheWrite, reasoning, unknown]
      properties:
        in: {type: integer, format: int64}
        out: {type: integer, format: int64}
        cacheRead:
          type: integer
          format: int64
          description: Only from the rows that reported it (see `unknown`).
        cacheWrite:
          type: integer
          format: int64
          description: Only from the rows that reported it (see `unknown`).
        reasoning:
          type: integer
          format: int64
          description: Only from the rows that reported it (see `unknown`).
        unknown:
          type: integer
          format: int64
          description: The review-and-skill rows whose pergent did not report the cache and reasoning counts.
    UsageDayView:
      description: One UTC day's usage.
      type: object
      required: [day, tokens]
      properties:
        day:
          type: string
          format: date
          description: YYYY-MM-DD, in UTC.
        tokens: {$ref: '#/components/schemas/UsageTokensView'}
    UsageRepositoryRowView:
      description: One repository in `GET /api/admin/usage`.
      type: object
      required: [instance, project, switchedOn, tokens, reviews]
      properties:
        instance: {type: string}
        project:
          type: string
          description: The path it was last reported under.
        switchedOn:
          type: boolean
          description: False for a repository switched off since, or on an instance that was removed; its usage is kept.
        tokens: {$ref: '#/components/schemas/UsageTokensView'}
        reviews:
          type: integer
          format: int64
          description: Reviews, a review once however many skills it ran.
    UsageOverviewView:
      description: Body of `GET /api/admin/usage`.
      type: object
      required: [days, tokens, reviews, daily, repositories]
      properties:
        days: {type: integer}
        tokens: {$ref: '#/components/schemas/UsageTokensView'}
        reviews: {type: integer, format: int64}
        daily:
          type: array
          items: {$ref: '#/components/schemas/UsageDayView'}
        repositories:
          type: array
          description: Busiest first.
          items: {$ref: '#/components/schemas/UsageRepositoryRowView'}
    UsageNamedView:
      description: One skill or model of a repository's usage.
      type: object
      required: [name, tokens, runs, failed]
      properties:
        name: {type: string}
        tokens: {$ref: '#/components/schemas/UsageTokensView'}
        runs:
          type: integer
          format: int64
          description: A run once, however many skills it ran.
        failed:
          type: integer
          format: int64
          description: The runs in which the skill failed; 0 for a model.
    UsageMRView:
      description: One merge request of a repository's usage.
      type: object
      required: [iid, title, webURL, tokens, reviews]
      properties:
        iid: {type: integer, format: int64}
        title:
          type: string
          description: The title of its latest review.
        webURL:
          type: string
          description: Its address; "" when it is not an http or https address.
        tokens: {$ref: '#/components/schemas/UsageTokensView'}
        reviews: {type: integer, format: int64}
    UsageWastedView:
      description: >-
        The tokens that bought no finished review. `reruns` are those of the
        re-runs someone asked for, apart and not waste; a skill that failed in
        a re-run is in both `failed` and `reruns`.
      type: object
      required: [failed, reruns, rerunCount, noResult, superseded]
      properties:
        failed: {$ref: '#/components/schemas/UsageTokensView'}
        reruns: {$ref: '#/components/schemas/UsageTokensView'}
        rerunCount: {type: integer, format: int64}
        noResult:
          type: integer
          format: int64
          description: Reviews that left no result; their tokens are unknown.
        superseded:
          type: integer
          format: int64
          description: Reviews stopped by a newer push before their result; their tokens are unknown.
    UsageOutlierView:
      description: A review that used more than three times its kind's median.
      type: object
      required: [runID, iid, incremental, total, at]
      properties:
        runID: {type: string}
        iid: {type: integer, format: int64}
        incremental: {type: boolean}
        total:
          type: integer
          format: int64
          description: Input plus output tokens.
        at:
          type: string
          format: date-time
    UsageRepositoryView:
      description: Body of `GET /api/repositories/{instance}/{project}/usage`.
      type: object
      required: [days, daily, skills, models, mergeRequests, wasted, fullMedian, incrementalMedian, outliers]
      properties:
        days: {type: integer}
        daily:
          type: array
          items: {$ref: '#/components/schemas/UsageDayView'}
        skills:
          type: array
          description: Busiest first.
          items: {$ref: '#/components/schemas/UsageNamedView'}
        models:
          type: array
          description: Busiest first.
          items: {$ref: '#/components/schemas/UsageNamedView'}
        mergeRequests:
          type: array
          description: The 50 busiest, busiest first.
          items: {$ref: '#/components/schemas/UsageMRView'}
        wasted: {$ref: '#/components/schemas/UsageWastedView'}
        fullMedian:
          type: [number, 'null']
          description: The median tokens of a full review; null with none.
        incrementalMedian:
          type: [number, 'null']
          description: The median tokens of an incremental review; null with none.
        outliers:
          type: array
          description: Costliest first, 20 at most.
          items: {$ref: '#/components/schemas/UsageOutlierView'}
    UserView:
      description: One account.
      type: object
      required: [id, kind, username, email, role, invited, lastSignInAt, waiting, teams]
      properties:
        id: {type: integer}
        kind:
          type: string
          enum: [password, sso]
          description: '"password" (a local admin) or "sso".'
        username: {type: string}
        email:
          type: string
          description: An SSO account's email; "" for a local admin.
        role:
          type: string
          enum: [admin, user]
        invited:
          type: boolean
          description: An SSO account an admin added that has not signed in yet.
        lastSignInAt:
          type: [string, 'null']
          format: date-time
          description: Null for an account that never signed in.
        waiting:
          type: boolean
          description: An SSO account that signed in, is not an admin and is on no team.
        teams:
          type: array
          items: {$ref: '#/components/schemas/TeamRef'}
    RepoTeamView:
      description: A team as one repository's settings show it.
      type: object
      required: [id, name, members, direct, wholeInstance]
      properties:
        id: {type: integer}
        name: {type: string}
        members:
          type: integer
          description: How many accounts are on the team.
        direct:
          type: boolean
          description: The team lists this repository itself.
        wholeInstance:
          type: boolean
          description: The team covers every repository of the repository's instance.
    RepoTeamsView:
      description: Body of GET and PUT .../teams of a repository.
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items: {$ref: '#/components/schemas/RepoTeamView'}
    signInOptionsView:
      description: Body of GET /api/sign-in-options.
      type: object
      required: [password, jwt]
      properties:
        password:
          type: boolean
          description: The password form is shown, on `/admin/sign-in`. Always true.
        sso:
          anyOf:
            - {$ref: '#/components/schemas/ssoView'}
            - {type: 'null'}
          description: The OIDC button, on both sign-in pages. Absent when OIDC sign-in is not set up, and in JWT mode.
        jwt:
          type: boolean
          description: A proxy signs people in (JWT mode). There is no button; a page load signs the person in.
    meView:
      description: The signed-in user. Body of GET /api/me.
      type: object
      required: [kind, username, email, role, signIn, admin, waiting, mustChangePassword, waitingUsers, csrfToken]
      properties:
        kind:
          type: string
          enum: [password, sso]
          description: '"password" (a local admin) or "sso".'
        username:
          type: string
          description: The name shown; the email of an SSO account.
        email:
          type: string
          description: An SSO account's email; "" for a local admin.
        role:
          type: string
          enum: [admin, user]
        signIn:
          type: string
          enum: [password, oidc, jwt]
          description: How the session began.
        admin:
          type: boolean
          description: The account's role is admin; it sees and may do everything.
        waiting:
          type: boolean
          description: A user on no team, which sees nothing.
        mustChangePassword:
          type: boolean
          description: Nothing else works until the password is changed.
        waitingUsers:
          type: integer
          description: For an admin, how many users are waiting for a team (SSO accounts with role user that signed in and are on no team); 0 for anyone else.
        csrfToken:
          type: string
          description: The token writes send in X-CSRF-Token.
    readiness.Checklist:
      description: The Readiness tab.
      type: object
      required: [sections, suggested, budget]
      properties:
        sections:
          type: array
          items: {$ref: '#/components/schemas/readiness.Section'}
        suggested:
          type: array
          items: {type: string}
          description: Library skills that fit the files and are not turned on.
        budget:
          type: integer
          description: The size of skills plus instructions.
    readiness.Context:
      description: The project context found at the root of the checkout.
      type: object
      properties:
        agentFile: {type: string}
        readme: {type: string}
        contributing: {type: string}
        codeOwners: {type: string}
        agentFileEmpty: {type: boolean}
        instructions: {type: boolean}
        codeOwnerRules: {type: integer}
      additionalProperties: true
    readiness.Item:
      description: 'One line of the checklist. Paths, names and reasons come from the scan Job: text only,
        never markup.'
      type: object
      required: [key, state, reason, why, fix]
      properties:
        key: {type: string}
        state:
          type: string
          enum: [passed, warning, missing, unknown]
          description: '"passed", "warning", "missing" or "unknown" (could not check; never shown or counted
            as passed).'
        reason:
          type: string
          description: The could-not-check reason, or what was found.
        why:
          type: string
          description: Only set when the item is not passed.
        fix:
          type: string
          description: Only set when the item is not passed.
        list:
          type: array
          items: {type: string}
        noise:
          type: array
          items: {$ref: '#/components/schemas/readiness.NoiseFile'}
        more: {type: integer}
    readiness.JobResult:
      description: What the readiness scan Job posts. `error` is set when it could not scan the files; then
        nothing else but version and commit is.
      type: object
      properties:
        version: {type: integer}
        commit: {type: string}
        error: {type: string}
        files: {type: integer}
        sourceFiles: {type: integer}
        noiseTotal: {type: integer}
        instructionsBytes: {type: integer}
        context: {$ref: '#/components/schemas/readiness.Context'}
        skills:
          type: array
          items: {$ref: '#/components/schemas/readiness.SkillFit'}
        languages:
          type: array
          items: {$ref: '#/components/schemas/readiness.Language'}
        noise:
          type: array
          items: {$ref: '#/components/schemas/readiness.NoiseFile'}
      additionalProperties: true
    readiness.Language:
      description: A language over 10% of the source files.
      type: object
      properties:
        name: {type: string}
        files: {type: integer}
        uncovered: {type: boolean}
      additionalProperties: true
    readiness.NoiseFile:
      description: A file a review would read that looks like noise.
      type: object
      required: [path, why, size]
      properties:
        path: {type: string}
        why: {type: string}
        size: {type: integer}
        skills:
          type: array
          items: {type: string}
    readiness.Section:
      description: 'A group of items: "context", "process", "skills" or "size".'
      type: object
      required: [key, items]
      properties:
        key: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/readiness.Item'}
    readiness.SkillFit:
      description: How one skill fits the checkout.
      type: object
      properties:
        name: {type: string}
        folder: {type: string}
        problem: {type: string}
        hasPaths: {type: boolean}
        files: {type: integer}
        bytes: {type: integer}
      additionalProperties: true
    result.BatchChecks:
      description: The checklist the model reported for one batch.
      type: object
      properties:
        batch: {type: integer}
        dropped: {type: integer}
        findings: {type: integer}
        checks:
          type: array
          items: {$ref: '#/components/schemas/result.Check'}
      additionalProperties: true
    result.Check:
      description: One checklist item.
      type: object
      properties:
        section: {type: string}
        name: {type: string}
        status: {type: string}
        detail: {type: string}
      additionalProperties: true
    result.Comment:
      description: The rendered comment, ready to post. `markdown` is required.
      type: object
      properties:
        markdown: {type: string}
        findings_block: {type: string}
      additionalProperties: true
      required: [markdown]
    result.Error:
      description: Why an error result is one.
      type: object
      properties:
        code: {type: string}
        message: {type: string}
      additionalProperties: true
    result.Failure:
      description: A batch of a skill that did not finish.
      type: object
      properties:
        files:
          type: array
          items: {type: string}
        message: {type: string}
      additionalProperties: true
    result.Files:
      description: What a skill looked at. Its verdict covers `reviewed` only.
      type: object
      properties:
        reviewed:
          type: array
          items: {type: string}
        carried:
          type: array
          items: {type: string}
        skipped:
          type: array
          items: {$ref: '#/components/schemas/result.Skipped'}
        not_reviewed:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              path: {type: string}
              cause: {type: string}
          description: Entries have a `path` and a `cause`.
      additionalProperties: true
    result.Finding:
      description: One finding of a skill. pergent.sh reads these fields; the finding may carry others.
      type: object
      properties:
        id: {type: string}
        fingerprint: {type: string}
        file: {type: string}
        line: {type: integer}
        end_line: {type: integer}
        severity: {type: string}
        title: {type: string}
        explanation: {type: string}
        suggested_fix: {type: string}
        suggestion: {type: string}
        linked:
          $ref: '#/components/schemas/result.Linked'
      additionalProperties: true
      required: [file, severity, title]
    result.Linked:
      description: The caller, in a linked repository, that a finding of the `impact` skill says the change breaks. Not drawn in the comment.
      type: object
      properties:
        repo: {type: string, description: "The link's name, owner/name."}
        file: {type: string}
        line: {type: integer}
      additionalProperties: true
      required: [repo, file, line]
    result.Incremental:
      description: What an incremental review did.
      type: object
      properties:
        reviewed: {type: integer}
        carried: {type: integer}
        from: {type: string}
      additionalProperties: true
    result.Result:
      description: 'Pergent''s result schema v1, the fields pergent.sh reads. Unknown fields are accepted
        and ignored. Full schema: https://github.com/gopaytech/pergent/blob/master/docs/agent-result-schema.md'
      type: object
      properties:
        schema_version:
          type: integer
          description: Always 1.
        status:
          type: string
          enum: [completed, error]
          description: '"completed", or "error" (then `error` says why).'
        pergent_version:
          type: string
          description: The pergent version that made it.
        base:
          type: string
          description: The full SHA the review started from.
        head:
          type: string
          description: The full SHA reviewed.
        skills:
          type: array
          items: {$ref: '#/components/schemas/result.Skill'}
          description: One entry per skill. A completed result has at least one.
        error:
          oneOf:
          - $ref: '#/components/schemas/result.Error'
          - type: 'null'
        comment: {$ref: '#/components/schemas/result.Comment'}
        merged:
          type: boolean
          description: Set only by pergent.sh after it merged an incremental result. A result that carries
            it is refused.
        merge_note:
          type: string
          description: Set only by pergent.sh. A result that carries it is refused.
        incremental:
          oneOf:
          - $ref: '#/components/schemas/result.Incremental'
          - type: 'null'
          description: Set by pergent.sh on the result of an incremental review.
      additionalProperties: true
      required: [schema_version, status, comment]
    result.Skill:
      description: The outcome of one skill.
      type: object
      properties:
        name: {type: string}
        verdict:
          type: string
          description: '"no_blocking_issues", "has_blocking_issues" or "failed".'
        findings:
          type: array
          items: {$ref: '#/components/schemas/result.Finding'}
          description: Each entry is a result.Finding (kept raw by pergent.sh).
        files: {$ref: '#/components/schemas/result.Files'}
        failures:
          type: array
          items: {$ref: '#/components/schemas/result.Failure'}
        notes:
          type: array
          items: {type: string}
        summaries:
          type: array
          items: {$ref: '#/components/schemas/result.Summary'}
        checks:
          type: array
          items: {$ref: '#/components/schemas/result.BatchChecks'}
        batches: {type: integer}
        batches_finished: {type: integer}
        confidence:
          type: integer
          description: The model's own score, 1 to 5 (0 when it gave none).
        confidence_reason: {type: string}
      additionalProperties: true
    result.Skipped:
      description: A file left out of a review, and the rule that left it out.
      type: object
      properties:
        path: {type: string}
        rule: {type: string}
      additionalProperties: true
    result.Summary:
      description: The model's summary of one batch.
      type: object
      properties:
        batch: {type: integer}
        text: {type: string}
      additionalProperties: true
    skillfetch.JobResult:
      description: 'What a fetch Job posts: the commit it read and the skills of the folder, or `error` when
        it could not read them.'
      type: object
      properties:
        commit: {type: string}
        error: {type: string}
        files:
          type: array
          items: {$ref: '#/components/schemas/store.FetchedFile'}
      additionalProperties: true
    store.FetchedFile:
      description: One skill file a fetch Job read. `content` is empty when it was not kept.
      type: object
      properties:
        name: {type: string}
        path: {type: string}
        content: {type: string}
        problem: {type: string}
      additionalProperties: true
