name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pergent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The binary embeds the dashboard build, so test and build the real one.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard
        run: make web
      # The build output is ignored by git; nothing tracked may change.
      - name: Check the build left the tree clean
        run: git diff --exit-code
      - name: Vet
        run: go vet ./...
      # The database tests run in parallel, 4 packages at once, and each
      # test has pools of its own: 100 connections (the default) is tight.
      - name: Raise the database's max_connections
        run: |
          pg=${{ job.services.postgres.id }}
          docker exec "$pg" psql -U postgres -c 'ALTER SYSTEM SET max_connections = 300'
          docker restart "$pg"
          for i in $(seq 30); do docker exec "$pg" pg_isready -U postgres && break; sleep 1; done
          docker exec "$pg" psql -U postgres -tAc 'SHOW max_connections' | grep -qx 300
      # The database tests are slow: internal/engine alone takes about 7.5
      # minutes, too close to go test's default limit of 10 minutes per package.
      - name: Test
        env:
          PERGENT_SH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pergent_test?sslmode=disable
        run: go test -count=1 -timeout 30m ./...
      - name: Build
        run: make build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: |
          helm lint charts/pergent-sh
          helm lint charts/pergent-sh -f charts/pergent-sh/ci-values.yaml
      - name: Template
        run: |
          helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml
          helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --set config.dashboard.url=https://pergent-dashboard.example.com
          helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            | grep -q 'callback_url: http://t-pergent-sh.pergent-sh.svc:8080$'
          helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --set config.callback_url=https://pergent.example.com \
            | grep -q 'callback_url: https://pergent.example.com$'
          # Metrics are off by default, and a Service of their own when on. A
          # failing `! cmd` does not stop a bash -e script, so these use if.
          if helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            | grep -qE 'metrics_listen|-metrics$'; then
            echo "metrics are on by default" >&2
            exit 1
          fi
          metrics=$(helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --set metrics.enabled=true)
          echo "$metrics" | grep -q 'metrics_listen: :9090$'
          echo "$metrics" | grep -q 'containerPort: 9090$'
          echo "$metrics" | grep -q 'name: t-pergent-sh-metrics$'
          # The metrics Service stays ClusterIP when the main one is a LoadBalancer.
          helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --set metrics.enabled=true --set service.type=LoadBalancer \
            --show-only templates/metrics-service.yaml | grep -q 'type: ClusterIP$'
          # The chart sets metrics_listen itself.
          if helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --set config.metrics_listen=:9090 > /dev/null 2>&1; then
            echo "config.metrics_listen was accepted" >&2
            exit 1
          fi
          # Code graphs are off by default: no PVC, no env, no fsGroup. On, they
          # need the dashboard and add all three.
          if helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            | grep -qE 'PERGENT_SH_GRAPH|PersistentVolumeClaim|fsGroup'; then
            echo "code graphs are on by default" >&2
            exit 1
          fi
          graphs=$(helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --set config.dashboard.url=https://pergent-dashboard.example.com --set graphs.enabled=true)
          echo "$graphs" | grep -q 'kind: PersistentVolumeClaim$'
          echo "$graphs" | grep -q 'claimName: t-pergent-sh-graphs$'
          echo "$graphs" | grep -q 'value: /var/lib/pergent-sh/graphs$'
          echo "$graphs" | grep -q 'value: "ghcr.io/gopaytech/pergent.sh-graph:'
          if helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --set graphs.enabled=true > /dev/null 2>&1; then
            echo "graphs.enabled was accepted without the dashboard" >&2
            exit 1
          fi
          # Security scans have no egress by default: no PERGENT_SH_SECURITY_EGRESS and
          # no ipBlock in the scan policy, which still selects the scan pods. With a
          # CIDR both appear, in the scan policy only. The jobs policy always leaves
          # the scan pods out, or its jobEgress would apply to them too.
          # policy prints one NetworkPolicy of the rendered file, by its name.
          policy() { awk -v want="  name: $1" '/^---/{f=0} $0 == want{f=1} f'; }
          if helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            | grep -q 'PERGENT_SH_SECURITY_EGRESS'; then
            echo "security scan egress is on by default" >&2
            exit 1
          fi
          policies=$(helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --show-only templates/networkpolicy.yaml)
          if echo "$policies" | policy t-pergent-sh-security-jobs | grep -q 'ipBlock'; then
            echo "the security scan policy has an ipBlock by default" >&2
            exit 1
          fi
          echo "$policies" | policy t-pergent-sh-security-jobs | grep -q 'operator: Exists$'
          echo "$policies" | policy t-pergent-sh-jobs | grep -q 'operator: DoesNotExist$'
          # 203.0.113.0/24 is in no list of ci-values.yaml.
          if grep -q '203\.0\.113\.' charts/pergent-sh/ci-values.yaml; then
            echo "ci-values.yaml uses the test CIDR" >&2
            exit 1
          fi
          helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --set 'securityJobEgress.cidrs={203.0.113.0/24}' | grep -q 'name: PERGENT_SH_SECURITY_EGRESS$'
          scan=$(helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --set 'securityJobEgress.cidrs={203.0.113.0/24}' --show-only templates/networkpolicy.yaml)
          echo "$scan" | policy t-pergent-sh-security-jobs | grep -q 'cidr: "203.0.113.0/24"$'
          if echo "$scan" | policy t-pergent-sh-jobs | grep -q '203\.0\.113\.'; then
            echo "the security scan CIDR is in the jobs policy" >&2
            exit 1
          fi
          # networkPolicy.enabled=false: no NetworkPolicy, and scans are on.
          nopol=$(helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --set networkPolicy.enabled=false)
          if echo "$nopol" | grep -q '^kind: NetworkPolicy$'; then
            echo "networkPolicy.enabled=false still renders a NetworkPolicy" >&2
            exit 1
          fi
          echo "$nopol" | grep -q 'name: PERGENT_SH_SECURITY_EGRESS$'

  # Publishes the newest main build as ghcr.io/gopaytech/pergent.sh:main and
  # :sha-<short sha>. Not on pull requests. `latest` stays the release tag
  # (see release.yml).
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ web, test, chart ]
    runs-on: ubuntu-latest
    # One build at a time; with the tip check below, an older build never
    # overwrites :main after a newer one.
    concurrency:
      group: image-main
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # The concurrency group runs one build at a time but doesn't order
      # them: a build that waited behind a newer push would overwrite :main
      # with an older commit. Only the tip of main is built; anything older
      # succeeds without pushing.
      - name: Check this commit is still the tip of main
        id: tip
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          tip="$(git rev-parse refs/remotes/origin/main)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not building: main is at $tip now, not $GITHUB_SHA; its own build publishes :main."
          fi
      # Set up QEMU so any RUN step of the arm64 image works on an amd64
      # runner (the Dockerfile cross-compiles, so none needs it today).
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        if: steps.tip.outputs.current == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        if: steps.tip.outputs.current == 'true'
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: main and sha-<short sha>; no latest.
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        if: steps.tip.outputs.current == 'true'
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        if: steps.tip.outputs.current == 'true'
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      # The code graph build image: graph.Dockerfile, same tags.
      - name: Extract graph image metadata
        id: graphmeta
        if: steps.tip.outputs.current == 'true'
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-graph
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha
      - name: Build and push the graph image
        if: steps.tip.outputs.current == 'true'
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: graph.Dockerfile
          provenance: false
          push: true
          tags: ${{ steps.graphmeta.outputs.tags }}
          labels: ${{ steps.graphmeta.outputs.labels }}
          cache-from: type=gha,scope=graph
          cache-to: type=gha,mode=max,scope=graph
          platforms: linux/amd64,linux/arm64
