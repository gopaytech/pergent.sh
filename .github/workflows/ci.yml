name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pergent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          PERGENT_SH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pergent_test?sslmode=disable
        run: go test -count=1 ./...
      - name: Build
        run: make build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: |
          helm lint deploy/helm/pergent-sh
          helm lint deploy/helm/pergent-sh -f deploy/helm/pergent-sh/ci-values.yaml
      - name: Template
        run: helm template t deploy/helm/pergent-sh --namespace pergent-sh -f deploy/helm/pergent-sh/ci-values.yaml
