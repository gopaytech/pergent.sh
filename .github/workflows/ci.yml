name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pergent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The binary embeds the dashboard build, so test and build the real one.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard
        run: make web
      # The build output is ignored by git; nothing tracked may change.
      - name: Check the build left the tree clean
        run: git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          PERGENT_SH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pergent_test?sslmode=disable
        run: go test -count=1 ./...
      - name: Build
        run: make build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: |
          helm lint charts/pergent-sh
          helm lint charts/pergent-sh -f charts/pergent-sh/ci-values.yaml
      - name: Template
        run: |
          helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml
          helm template t charts/pergent-sh --namespace pergent-sh -f charts/pergent-sh/ci-values.yaml \
            --set dashboardIngress.enabled=true --set config.dashboard.url=https://pergent-dashboard.example.com

  # Publishes the newest main build as ghcr.io/gopaytech/pergent.sh:main and
  # :sha-<short sha>. Not on pull requests. `latest` stays the release tag
  # (see release.yml).
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ web, test, chart ]
    runs-on: ubuntu-latest
    # One build at a time; with the tip check below, an older build never
    # overwrites :main after a newer one.
    concurrency:
      group: image-main
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # The concurrency group runs one build at a time but doesn't order
      # them: a build that waited behind a newer push would overwrite :main
      # with an older commit. Only the tip of main is built; anything older
      # succeeds without pushing.
      - name: Check this commit is still the tip of main
        id: tip
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          tip="$(git rev-parse refs/remotes/origin/main)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not building: main is at $tip now, not $GITHUB_SHA; its own build publishes :main."
          fi
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        if: steps.tip.outputs.current == 'true'
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: main and sha-<short sha>; no latest.
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        if: steps.tip.outputs.current == 'true'
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        if: steps.tip.outputs.current == 'true'
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
