apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pergent-sh.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pergent-sh.labels" . | nindent 4 }}
spec:
  # One replica only: at startup pergent-sh requeues runs it had claimed but
  # not launched, which assumes no other pod is dispatching. Recreate keeps an
  # old and a new pod from overlapping during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pergent-sh.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pergent-sh.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pergent-sh.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pergent-sh
          image: {{ include "pergent-sh.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/pergent-sh/config.yaml
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            # A skill fetch Job sends the skills of a public URL back with
            # this same image (pergent-sh fetch-skills).
            - name: PERGENT_SH_IMAGE
              value: {{ include "pergent-sh.image" . | quote }}
          {{- if .Values.adminPassword.existingSecret }}
            # The first local admin's password, under the name the config's
            # dashboard.admin_password_env gives it.
            - name: {{ .Values.config.dashboard.admin_password_env }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminPassword.existingSecret }}
                  key: {{ .Values.adminPassword.key }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          # pergent-sh listens only after it has checked the config, the
          # database, the migrations, the GitLab tokens and the GitHub Apps,
          # so give it time.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/pergent-sh/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "pergent-sh.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
