image:
  # -- Image repository.
  repository: ghcr.io/gopaytech/pergent.sh
  # -- Image tag. A released chart pins its own release. "main" is the newest build of the main branch (it moves, so use pullPolicy Always with it); "sha-<short sha>" pins one build. Empty means the chart appVersion.
  # Releasing the chart: set this to the release version (and pullPolicy to IfNotPresent); "main" must not ship in a released chart.
  tag: v0.12.0
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Secrets for pulling the image from a private registry.
imagePullSecrets: []
# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full resource name.
fullnameOverride: ""

# -- Name of an existing Secret in the release namespace (required). It is mounted with envFrom and always holds:
# DATABASE_URL (PostgreSQL connection URL);
# PERGENT_SH_SECRET_KEY (32 random bytes, standard base64).
# Instances, tokens, App keys and the LLM key can be entered in the dashboard instead. Only when they are in the config file (config.gitlab, config.github, config.llm) does the Secret also hold:
# OPENCODE_API_KEY (the LLM key, the env var named by config.llm.api_key_env);
# every env var named by config.gitlab[*].review_token_env, approve_token_env (none with approve_with_review_bot) and webhook_secret_env;
# every env var named by config.github[*].review_app.private_key_env, approve_app.private_key_env (or approve_token_env; none with approve_with_review_app) and webhook_secret_env;
# the env var named by config.dashboard.sign_in.client_secret_env, when OIDC sign-in is set in the config file (set in the dashboard, the client secret is entered there).
# A private key is the App's whole PEM file, e.g. --from-file=GITHUB_REVIEW_APP_KEY=review-app.private-key.pem
existingSecret: ""

adminPassword:
  # -- Name of an existing Secret holding the first local admin's password (at least 12 characters). The chart passes it to the pod as the env var named by config.dashboard.admin_password_env, which must then be set. Optional: without it pergent.sh generates the password and logs it once at the first start ("initial admin password"). Either way the admin must change it at the first sign-in, and the value is read only on the start that creates the admin.
  existingSecret: ""
  # -- Key of that Secret that holds the password.
  key: password

# -- The namespace the review Jobs run in. It must already exist. The chart creates the Role, RoleBinding and NetworkPolicy there. Must equal config.jobs.namespace.
jobsNamespace: pergent

# Where review Jobs may connect over TCP 443 and 80: GitLab or GitHub (Jobs
# clone over HTTPS), the LLM provider and (only if config.callback_url is set
# to a public address) the pergent.sh URL.
jobEgress:
  # -- CIDRs the Jobs may reach on TCP 443 and 80. The default 0.0.0.0/0 lets a Job reach ANY address on 80/443, including in-cluster services and the cloud metadata endpoint: narrow it to GitLab or GitHub and the LLM provider. An EMPTY list allows no external egress at all: Jobs can then only use DNS and the pergent.sh callback (on 8080).
  cidrs:
    - 0.0.0.0/0
  # -- Optional ranges carved out of EVERY cidr above (NetworkPolicy "except"), e.g. 169.254.169.254/32. Kubernetes rejects an entry that lies outside its cidr, so use this with broad cidrs such as the default 0.0.0.0/0.
  except: []

# Instances and the LLM can be entered in the dashboard instead of here, with
# their secrets. Only a GitOps install keeps them in the config. E.g. for
# GitLab (add llm: the same way when the LLM is not set in the dashboard):
# config:
#   gitlab:
#     - name: main
#       url: https://gitlab.example.com
#       review_token_env: GITLAB_REVIEW_TOKEN
#       approve_token_env: GITLAB_APPROVE_TOKEN   # or approve_with_review_bot: true
#       webhook_secret_env: GITLAB_WEBHOOK_SECRET
#   llm:
#     provider: anthropic
#     model: claude-sonnet-4
#     api_key_env: OPENCODE_API_KEY
#
# For GitHub, add a github list (one entry per GitHub App, or per pair of Apps with a separate approve App). E.g.
# github:
#   - name: gh
#     review_app:
#       app_id: 123456
#       private_key_env: GITHUB_REVIEW_APP_KEY
#     approve_with_review_app: true   # or approve_app: {app_id, private_key_env}, or approve_token_env
#     webhook_secret_env: GITHUB_WEBHOOK_SECRET

# To turn the dashboard on, set config.dashboard.url and route its host to
# the Service (see "Exposing pergent.sh" in docs/setup/install.md). The "Dashboard" page in docs/concepts explains each
# step. Local admins sign in with a password at /admin/sign-in. Everyone else
# signs in with OIDC (or a JWT from your proxy), which an admin sets up on
# Admin -> Integrations -> Sign-in, or here. The client secret is not in the
# config: dashboard.sign_in.client_secret_env names an env var, a key of the
# Secret existingSecret names. With sign-in set here, the dashboard shows it
# read-only. A config from an older release may still name oauth_client_id_env
# and oauth_client_secret_env on an instance: they are ignored, with a warning.
# E.g.
#   dashboard:
#     url: https://pergent-dashboard.example.com
#     admin_password_env: PERGENT_SH_ADMIN_PASSWORD   # with adminPassword.existingSecret
#     sign_in:
#       mode: oidc                                    # or jwt
#       label: Google
#       issuer: https://accounts.google.com
#       client_id: 1234567890-abc.apps.googleusercontent.com
#       client_secret_env: PERGENT_SH_OIDC_CLIENT_SECRET
#       allowed_domains: [example.com]
#       allowed_emails: []

# -- Rendered to /etc/pergent-sh/config.yaml. callback_url defaults to this chart's Service, so Jobs post their results inside the cluster; set it to send them elsewhere. See the repository README for every field and for examples of config.gitlab, config.github, config.llm and config.dashboard ("Config reference", "Instances and the LLM in the config file"). No instance and no LLM are set by default: without config.dashboard.url, pergent.sh needs at least one instance and an LLM here. listen is fixed by the chart: leave it as it is. skills_dir was removed: the skill library lives in the dashboard.
config:
  listen: ":8080"
  public_url: https://pergent.example.com
  repositories: []
  jobs:
    namespace: pergent

serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to the release's full name.
  name: ""
  # -- Annotations of the ServiceAccount.
  annotations: {}

# The chart creates no Ingress. Route traffic to this Service yourself (Gateway API,
# your own Ingress, a LoadBalancer); "Exposing pergent.sh" in docs/setup/install.md lists the paths.
service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 8080

# Prometheus metrics: token, review and finding counters read from the database at each scrape. Off by default. They are served on their own port, through their own ClusterIP Service, never through the main Service, which may be a LoadBalancer.
metrics:
  # -- Serve /metrics on metrics.port.
  enabled: false
  # -- Port of the metrics server and its Service.
  port: 9090
  serviceMonitor:
    # -- Create a ServiceMonitor (needs the Prometheus Operator's CRDs).
    enabled: false
    # -- Scrape interval.
    interval: 60s
    # -- Extra labels, for a Prometheus that selects ServiceMonitors by label.
    labels: {}

# -- Resources of the pergent.sh pod.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# -- Annotations of the pod.
podAnnotations: {}
# -- Extra labels of the pod.
podLabels: {}
# -- Node selector of the pod.
nodeSelector: {}
# -- Tolerations of the pod.
tolerations: []
# -- Affinity of the pod.
affinity: {}
