image:
  # -- Image repository.
  repository: ghcr.io/gopaytech/pergent.sh
  # -- Image tag. "main" is the newest build of the main branch (it moves, hence pullPolicy Always). For production pin "sha-<short sha>" or a release tag such as v0.1.0 (then IfNotPresent is enough). Empty means the chart appVersion.
  # Releasing the chart: set this to the release version (and pullPolicy to IfNotPresent); "main" must not ship in a released chart.
  tag: main
  # -- Image pull policy.
  pullPolicy: Always

# -- Secrets for pulling the image from a private registry.
imagePullSecrets: []
# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full resource name.
fullnameOverride: ""

# -- Name of an existing Secret in the release namespace (required). It is mounted with envFrom and always holds:
# DATABASE_URL (PostgreSQL connection URL);
# PERGENT_SH_SECRET_KEY (32 random bytes, standard base64).
# Instances, tokens, App keys and the LLM key can be entered in the dashboard instead. Only when they are in the config file (config.gitlab, config.github, config.llm) does the Secret also hold:
# OPENCODE_API_KEY (the LLM key, the env var named by config.llm.api_key_env);
# every env var named by config.gitlab[*].review_token_env, approve_token_env and webhook_secret_env;
# every env var named by config.github[*].review_app.private_key_env, approve_app.private_key_env (or approve_token_env) and webhook_secret_env;
# every env var named by config.gitlab[*] and config.github[*] oauth_client_id_env and oauth_client_secret_env.
# A private key is the App's whole PEM file, e.g. --from-file=GITHUB_REVIEW_APP_KEY=review-app.private-key.pem
existingSecret: ""

adminPassword:
  # -- Name of an existing Secret holding the first password admin's password (at least 12 characters). The chart passes it to the pod as the env var named by config.dashboard.admin_password_env, which must then be set. Optional: without it pergent.sh generates the password and logs it once at the first start ("initial admin password"). Either way the admin must change it at the first sign-in, and the value is read only on the start that creates the admin.
  existingSecret: ""
  # -- Key of that Secret that holds the password.
  key: password

# -- The namespace the review Jobs run in. It must already exist. The chart creates the Role, RoleBinding and NetworkPolicy there. Must equal config.jobs.namespace.
jobsNamespace: pergent

# Where review Jobs may connect over TCP 443 and 80: GitLab or GitHub (Jobs
# clone over HTTPS), the LLM provider and (unless callback_url is an
# in-cluster address) the pergent.sh URL.
jobEgress:
  # -- CIDRs the Jobs may reach on TCP 443 and 80. The default 0.0.0.0/0 lets a Job reach ANY address on 80/443, including in-cluster services and the cloud metadata endpoint: narrow it to GitLab or GitHub and the LLM provider. An EMPTY list allows no external egress at all: Jobs can then only use DNS and the pergent.sh callback (on 8080).
  cidrs:
    - 0.0.0.0/0
  # -- Optional ranges carved out of EVERY cidr above (NetworkPolicy "except"), e.g. 169.254.169.254/32. Kubernetes rejects an entry that lies outside its cidr, so use this with broad cidrs such as the default 0.0.0.0/0.
  except: []

# Instances and the LLM can be entered in the dashboard instead of here, with
# their secrets. Only a GitOps install keeps them in the config. E.g. for
# GitLab (add llm: the same way when the LLM is not set in the dashboard):
# config:
#   gitlab:
#     - name: main
#       url: https://gitlab.example.com
#       review_token_env: GITLAB_REVIEW_TOKEN
#       approve_token_env: GITLAB_APPROVE_TOKEN
#       webhook_secret_env: GITLAB_WEBHOOK_SECRET
#   llm:
#     provider: anthropic
#     model: claude-sonnet-4
#     api_key_env: OPENCODE_API_KEY
#
# For GitHub, add a github list (one entry per pair of GitHub Apps). E.g.
# github:
#   - name: gh
#     review_app:
#       app_id: 123456
#       private_key_env: GITHUB_REVIEW_APP_KEY
#     approve_app:
#       app_id: 123457
#       private_key_env: GITHUB_APPROVE_APP_KEY
#     webhook_secret_env: GITHUB_WEBHOOK_SECRET

# To turn the dashboard on, set config.dashboard.url and enable
# dashboardIngress (below). The README's "Dashboard" section explains each
# step. People sign in with a GitLab or GitHub instance that has an OAuth
# client (in the dashboard, or in the config as below). E.g.
#   gitlab:
#     - name: main
#       ...
#       oauth_client_id_env: GITLAB_OAUTH_CLIENT_ID
#       oauth_client_secret_env: GITLAB_OAUTH_CLIENT_SECRET
#   dashboard:
#     url: https://pergent-dashboard.example.com
#     admin_password_env: PERGENT_SH_ADMIN_PASSWORD   # with adminPassword.existingSecret

# -- Rendered verbatim to /etc/pergent-sh/config.yaml. See the repository README for every field and the examples above (config.gitlab, config.github, config.llm, config.dashboard). No instance and no LLM are set by default: without config.dashboard.url, pergent.sh needs at least one instance and an LLM here. listen and skills_dir are fixed by the chart: leave them as they are.
config:
  listen: ":8080"
  skills_dir: /etc/pergent-sh/skills
  public_url: https://pergent.example.com
  repositories: []
  jobs:
    namespace: pergent

# -- The skill library: file name (name.md) -> content. Mounted at /etc/pergent-sh/skills. A ConfigMap key can't hold a "/", so folder-style skills (<name>/SKILL.md) aren't possible here.
skills: {}

serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to the release's full name.
  name: ""
  # -- Annotations of the ServiceAccount.
  annotations: {}

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 8080

ingress:
  # -- Create an Ingress.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress host.
  host: pergent.example.com
  # -- Paths exposed. GitLab posts to /webhooks/gitlab/<instance>, GitHub to /webhooks/github/<instance>; Jobs post to /runs/<id>/result. The dashboard's paths (/, /api/, /auth/) are refused here: they go on dashboardIngress.
  paths:
    - /webhooks/
    - /runs/
  # -- Ingress TLS, e.g. `[{secretName: pergent-example-com-tls, hosts: [pergent.example.com]}]`.
  tls: []

# The dashboard's own Ingress, separate from the webhook Ingress above, so it
# can live on another (for example internal-only) host. It serves /, /api/
# and /auth/ from the same Service. config.dashboard.url must be this host's
# https address.
dashboardIngress:
  # -- Create the dashboard Ingress. Needs config.dashboard.url.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Dashboard hosts. One of them must be the host of config.dashboard.url, where sign-in always returns.
  hosts:
    - pergent-dashboard.example.com
  # -- Ingress TLS, e.g. `[{secretName: pergent-dashboard-example-com-tls, hosts: [pergent-dashboard.example.com]}]`. The dashboard's cookies are Secure, so browsers must reach it over https.
  tls: []

# -- Resources of the pergent.sh pod.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# -- Annotations of the pod.
podAnnotations: {}
# -- Extra labels of the pod.
podLabels: {}
# -- Node selector of the pod.
nodeSelector: {}
# -- Tolerations of the pod.
tolerations: []
# -- Affinity of the pod.
affinity: {}
