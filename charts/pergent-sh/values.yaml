image:
  # -- Image repository.
  repository: ghcr.io/gopaytech/pergent.sh
  # -- Image tag. A released chart pins its own release. "main" is the newest build of the main branch (it moves, so use pullPolicy Always with it); "sha-<short sha>" pins one build. Empty means the chart appVersion.
  # Releasing the chart: set this to the release version (and pullPolicy to IfNotPresent); "main" must not ship in a released chart.
  tag: v0.26.0
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Secrets for pulling the image from a private registry.
imagePullSecrets: []
# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full resource name.
fullnameOverride: ""

# -- Name of an existing Secret in the release namespace (required). It is mounted with envFrom and always holds:
# DATABASE_URL (PostgreSQL connection URL);
# PERGENT_SH_SECRET_KEY (32 random bytes, standard base64).
# Instances, tokens, App keys and the LLM key can be entered in the dashboard instead. Only when they are in the config file (config.gitlab, config.github, config.llm) does the Secret also hold:
# OPENCODE_API_KEY (the LLM key, the env var named by config.llm.api_key_env);
# every env var named by config.gitlab[*].review_token_env, approve_token_env (none with approve_with_review_bot) and webhook_secret_env;
# every env var named by config.github[*].review_app.private_key_env, approve_app.private_key_env (or approve_token_env; none with approve_with_review_app) and webhook_secret_env;
# the env var named by config.dashboard.sign_in.client_secret_env, when OIDC sign-in is set in the config file (set in the dashboard, the client secret is entered there).
# A private key is the App's whole PEM file, e.g. --from-file=GITHUB_REVIEW_APP_KEY=review-app.private-key.pem
existingSecret: ""

adminPassword:
  # -- Name of an existing Secret holding the first local admin's password (at least 12 characters). The chart passes it to the pod as the env var named by config.dashboard.admin_password_env, which must then be set. Optional: without it pergent.sh generates the password and logs it once at the first start ("initial admin password"). Either way the admin must change it at the first sign-in, and the value is read only on the start that creates the admin.
  existingSecret: ""
  # -- Key of that Secret that holds the password.
  key: password

# -- The namespace the review Jobs run in. It must already exist. The chart creates the Role, RoleBinding and NetworkPolicy there. Must equal config.jobs.namespace.
jobsNamespace: pergent

networkPolicy:
  # -- Create the 2 NetworkPolicies for the Jobs: the review Jobs one (jobEgress) and the security scan Jobs one (securityJobEgress). false creates neither: every Job may reach any address, jobEgress and securityJobEgress are ignored, and security scans are on with no securityJobEgress.cidrs. A scan Job runs a shell, so with false a scanned repository's instructions could send its LLM key anywhere.
  enabled: true

# Where review Jobs may connect over TCP 443 and 80: GitLab or GitHub (Jobs
# clone over HTTPS), the LLM provider and (only if config.callback_url is set
# to a public address) the pergent.sh URL.
jobEgress:
  # -- CIDRs the Jobs may reach on TCP 443 and 80. The default 0.0.0.0/0 lets a Job reach ANY address on 80/443, including in-cluster services and the cloud metadata endpoint: narrow it to GitLab or GitHub and the LLM provider. An EMPTY list allows no external egress at all: Jobs can then only use DNS and the pergent.sh callback (on 8080).
  cidrs:
    - 0.0.0.0/0
  # -- Optional ranges carved out of EVERY cidr above (NetworkPolicy "except"), e.g. 169.254.169.254/32. Kubernetes rejects an entry that lies outside its cidr, so use this with broad cidrs such as the default 0.0.0.0/0.
  except: []

# Where security scan Jobs may connect. A scan Job has its own NetworkPolicy and is left
# out of the jobs one above, so jobEgress does not apply to it.
# A scan gets its source from pergent.sh and posts its result there, both through
# config.callback_url. The scan policy allows only the pergent.sh pods in this cluster on
# 8080, so callback_url must be the chart's own in-cluster Service address (the default
# when you leave it out). A public callback_url makes every scan fail at the source download.
securityJobEgress:
  # -- CIDRs the security scan Jobs may reach on the ports below. Scans need config.callback_url to be the chart's in-cluster Service address (the default): the scan policy allows only the pergent.sh pods on 8080. No default: the LLM provider only (or the egress proxy, see config.security.proxy). Never add the GitLab or GitHub host: the scan gets the code from pergent.sh, not from the platform. An EMPTY list allows no external egress: scan Jobs then reach only the DNS servers below and the pergent.sh pods on 8080, and Start scan stays off (the chart sets no PERGENT_SH_SECURITY_EGRESS). Remaining risk: DNS queries through a recursive resolver can still carry data out.
  cidrs: []
  # -- Optional ranges carved out of EVERY cidr above (NetworkPolicy "except"). Kubernetes rejects an entry that lies outside its cidr.
  except: []
  # -- TCP ports the cidrs are open on (an empty list means 443 and 80, never all ports). A proxy must be in cidrs, and its port (for example 3128) in this list.
  ports:
    - 443
    - 80
  # -- DNS servers the scan Jobs may query on port 53 (TCP and UDP): a list of NetworkPolicy peers (the entries of "to"). Empty means the cluster DNS: pods labelled k8s-app=kube-dns in the kube-system namespace. Set it for NodeLocal DNSCache or another DNS label. Remaining risk: a resolver that recurses can still carry data out in the names it is asked.
  dns: []

# Instances and the LLM can be entered in the dashboard instead of here, with
# their secrets. Only a GitOps install keeps them in the config. E.g. for
# GitLab (add llm: the same way when the LLM is not set in the dashboard):
# config:
#   gitlab:
#     - name: main
#       url: https://gitlab.example.com
#       review_token_env: GITLAB_REVIEW_TOKEN
#       approve_token_env: GITLAB_APPROVE_TOKEN   # or approve_with_review_bot: true
#       webhook_secret_env: GITLAB_WEBHOOK_SECRET
#   llm:
#     provider: anthropic
#     model: claude-sonnet-4
#     api_key_env: OPENCODE_API_KEY
#
# For GitHub, add a github list (one entry per GitHub App, or per pair of Apps with a separate approve App). E.g.
# github:
#   - name: gh
#     review_app:
#       app_id: 123456
#       private_key_env: GITHUB_REVIEW_APP_KEY
#     approve_with_review_app: true   # or approve_app: {app_id, private_key_env}, or approve_token_env
#     webhook_secret_env: GITHUB_WEBHOOK_SECRET

# Security scans have 2 more keys in config, both
# optional. jobs.security_image is the scan Job image: it defaults to the pergent-security
# image with the same tag as the review image (jobs.image), so leave it out unless you mirror
# the image. security has max_running (default 1, up to 20), proxy (an egress proxy URL
# for the scan Jobs, no user info; its address must be in securityJobEgress.cidrs and its
# port in securityJobEgress.ports) and max_source_bytes (default 500 MiB, 1 MiB to 500 MiB). E.g.
#   jobs:
#     security_image: registry.example.com/pergent-security:v0.13.0
#   security:
#     max_running: 2
#     proxy: http://192.0.2.10:3128   # with securityJobEgress cidrs 192.0.2.10/32 and ports [3128]
# Scans also need securityJobEgress.cidrs above: without it no scan can start.

# To turn the dashboard on, set config.dashboard.url and route its host to
# the Service (see "Exposing pergent.sh" in docs/setup/install.md). The "Dashboard" page in docs/concepts explains each
# step. Local admins sign in with a password at /admin/sign-in. Everyone else
# signs in with OIDC (or a JWT from your proxy), which an admin sets up on
# Admin -> Integrations -> Sign-in, or here. The client secret is not in the
# config: dashboard.sign_in.client_secret_env names an env var, a key of the
# Secret existingSecret names. With sign-in set here, the dashboard shows it
# read-only. A config from an older release may still name oauth_client_id_env
# and oauth_client_secret_env on an instance: they are ignored, with a warning.
# E.g.
#   dashboard:
#     url: https://pergent-dashboard.example.com
#     admin_password_env: PERGENT_SH_ADMIN_PASSWORD   # with adminPassword.existingSecret
#     sign_in:
#       mode: oidc                                    # or jwt
#       label: Google
#       issuer: https://accounts.google.com
#       client_id: 1234567890-abc.apps.googleusercontent.com
#       client_secret_env: PERGENT_SH_OIDC_CLIENT_SECRET
#       allowed_domains: [example.com]
#       allowed_emails: []

# -- Rendered to /etc/pergent-sh/config.yaml. callback_url defaults to this chart's Service, so Jobs post their results inside the cluster; set it to send them elsewhere, but security scans need the in-cluster Service address: a scan gets its source from pergent.sh and posts its result there through callback_url, and the scan NetworkPolicy allows only the pergent.sh pods on 8080, so with a public callback_url every scan fails at the source download. See the repository README for every field and for examples of config.gitlab, config.github, config.llm and config.dashboard ("Config reference", "Instances and the LLM in the config file"). No instance and no LLM are set by default: without config.dashboard.url, pergent.sh needs at least one instance and an LLM here. listen is fixed by the chart: leave it as it is. skills_dir was removed: the skill library lives in the dashboard.
config:
  listen: ":8080"
  public_url: https://pergent.example.com
  repositories: []
  jobs:
    namespace: pergent

serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to the release's full name.
  name: ""
  # -- Annotations of the ServiceAccount.
  annotations: {}

# The chart creates no Ingress. Route traffic to this Service yourself (Gateway API,
# your own Ingress, a LoadBalancer); "Exposing pergent.sh" in docs/setup/install.md lists the paths.
service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 8080

# Prometheus metrics: token, review and finding counters read from the database at each scrape. Off by default. They are served on their own port, through their own ClusterIP Service, never through the main Service, which may be a LoadBalancer.
metrics:
  # -- Serve /metrics on metrics.port.
  enabled: false
  # -- Port of the metrics server and its Service.
  port: 9090
  serviceMonitor:
    # -- Create a ServiceMonitor (needs the Prometheus Operator's CRDs).
    enabled: false
    # -- Scrape interval.
    interval: 60s
    # -- Extra labels, for a Prometheus that selects ServiceMonitors by label.
    labels: {}

# Code graphs (docs/concepts/code-graph.md). Off by default, and then nothing
# changes. With them on, a repository's maintainers can turn on its Code graph
# switch in the dashboard: pergent.sh builds a graph of the default branch in a
# Job and gives it to the reviews of changes into that branch. The graphs are
# kept on a ReadWriteOnce volume mounted only on the pergent.sh pod.
graphs:
  # -- Keep code graphs: a PVC, and the graph build image. Needs the dashboard (config.dashboard.url), where the switch is.
  enabled: false
  image:
    # -- The graph build image: graphify and the pergent converter, no token. Its Job runs as user 65532.
    repository: ghcr.io/gopaytech/pergent.sh-graph
    # -- Its tag. Empty means the chart appVersion, as for image.tag.
    tag: ""
  persistence:
    # -- Size of the graphs volume. Only the newest graph of each repository is kept.
    size: 5Gi
    # -- Storage class of the graphs volume. Empty uses the cluster's default.
    storageClass: ""

# -- Resources of the pergent.sh pod.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# -- Annotations of the pod.
podAnnotations: {}
# -- Extra labels of the pod.
podLabels: {}
# -- Node selector of the pod.
nodeSelector: {}
# -- Tolerations of the pod.
tolerations: []
# -- Affinity of the pod.
affinity: {}
